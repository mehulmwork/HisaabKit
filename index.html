 * Build the purchase/sale entry form.
 * kind: 'purchase' | 'sale'
 * options: { id } to edit-in-place is not supported in Phase 1 — new only.
 */
function openTransactionForm(kind) {
  const isPurchase = kind === 'purchase';
  const title       = isPurchase ? 'Add Purchase' : 'New Sales Invoice';
  const partyLabel  = isPurchase ? 'Supplier' : 'Customer';
  const partyField  = isPurchase ? 'supplierId' : 'customerId';
  const docLabel    = isPurchase ? 'Bill Number' : 'Invoice Number';
  const dateLabel   = isPurchase ? 'Bill Date' : 'Invoice Date';
  const partyList   = isPurchase ? state.suppliers : state.customers;

  // Prefill the next document number from the prefix set in Settings, skipping
  // any number the sheet has already used.
  const nextNumber = isPurchase
    ? nextDocNumber(state.settings.purchasePrefix || 'PUR-', state.purchases, 'billNumber')
    : nextDocNumber(state.settings.invoicePrefix || 'INV-', state.sales, 'invoiceNumber');

  const partyOpts = partyList.length
    ? `<option value="">Select ${partyLabel.toLowerCase()}…</option>` +
      partyList.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')
    : `<option value="">No ${partyLabel.toLowerCase()}s yet</option>`;

  const body = `
    <form id="txnForm" novalidate>
      <div class="form-section">
        <div class="form-section-title">${isPurchase ? 'Purchase' : 'Invoice'} Details</div>
        <div class="form-grid">
          <div class="field" data-field="${partyField}">
            <label for="tParty">${partyLabel} <span class="req">*</span></label>
            <select class="select" id="tParty" name="${partyField}">${partyOpts}</select>
            <span class="err">Please select a ${partyLabel.toLowerCase()}</span>
          </div>
          <div class="field">
            <label for="tPhone">Phone</label>
            <input class="input" id="tPhone" name="phone" readonly
                   style="background:var(--background);" placeholder="—">
          </div>
          <div class="field">
            <label for="tNumber">${docLabel}</label>
            <input class="input" id="tNumber" name="docNumber" value="${escapeHtml(nextNumber)}" autocomplete="off">
          </div>
          <div class="field" data-field="date">
            <label for="tDate">${dateLabel} <span class="req">*</span></label>
            <input class="input" id="tDate" name="date" type="date" value="${todayISO()}">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Items</div>
        <div class="table-scroll" style="border:1px solid var(--border);border-radius:var(--radius);">
          <table class="items-table" id="txnItems" style="min-width:860px;">
            <thead><tr>
              <th style="width:38px;">#</th>
              <th style="min-width:210px;">Item</th>
              <th style="width:88px;">Qty</th>
              <th style="width:78px;">Unit</th>
              <th style="width:118px;">Price / Unit</th>
              <th style="width:82px;">GST %</th>
              <th style="width:104px;text-align:right;">Tax Amount</th>
              <th style="width:114px;text-align:right;">Amount</th>
              <th style="width:42px;"></th>
            </tr></thead>
            <tbody id="txnLines"></tbody>
          </table>
        </div>
        <button class="btn btn-default btn-sm" type="button" id="addLine" style="margin-top:10px;">
          ${icon('plus', 14)} Add Row
        </button>
      </div>

      <div class="form-section">
        <div class="form-section-title">Summary &amp; Payment</div>
        <div class="grid-2" style="align-items:start;">
          <div class="form-grid" style="grid-template-columns:1fr;">
            <div class="field">
              <label for="tPayType">Payment Type</label>
              <select class="select" id="tPayType" name="paymentType">
                ${PAYMENT_TYPES.map(p => `<option value="${p}">${p}</option>`).join('')}
              </select>
            </div>
            <div class="field" data-field="paid">
              <label for="tPaid">Paid Amount</label>
              <div class="input-affix">
                <span class="prefix">${currencySymbol()}</span>
                <input class="input" id="tPaid" name="paid" type="number" min="0" step="0.01" value="0">
              </div>
              <span class="err">Paid amount cannot exceed the total</span>
            </div>
            <div class="field">
              <label>Balance Due</label>
              <div class="kv-row" style="padding:9px 0;">
                <span class="k">Total − Paid</span>
                <span class="v" id="tBalance" style="font-size:15px;">${formatCurrency(0)}</span>
              </div>
            </div>
            <div class="field">
              <label for="tNotes">Notes</label>
              <input class="input" id="tNotes" name="notes" autocomplete="off"
                     placeholder="${isPurchase ? 'Supplier bill reference…' : 'Delivery or order note…'}">
            </div>
          </div>

          <div class="totals-panel">
            <div class="total-row">
              <span class="k">Subtotal</span>
              <span class="v" id="tSubtotal">${formatCurrency(0)}</span>
            </div>
            <div class="total-row">
              <span class="k">Discount</span>
              <input class="input" id="tDiscount" name="discount" type="number" min="0" step="0.01" value="0">
            </div>
            <div class="total-row">
              <span class="k">Tax (GST)</span>
              <span class="v" id="tTax">${formatCurrency(0)}</span>
            </div>
            <div class="total-row">
              <span class="k">Round Off</span>
              <span class="v" id="tRound">${formatCurrency(0)}</span>
            </div>
            <div class="total-row grand">
              <span class="k">Total</span>
              <span class="v" id="tTotal">${formatCurrency(0)}</span>
            </div>
          </div>
        </div>
      </div>
    </form>`;

  const footer = `
    <button class="btn btn-default" type="button" data-modal-close>Cancel</button>
    <button class="btn btn-primary" type="submit" form="txnForm">
      ${icon('check', 15)} ${isPurchase ? 'Save Purchase' : 'Save Invoice'}
    </button>`;

  openModal({
    title, size: 'xl', body, footer,
    onMount(el) {
      const form     = el.querySelector('#txnForm');
      const linesEl  = el.querySelector('#txnLines');
      const partySel = el.querySelector('#tParty');
      const phoneIn  = el.querySelector('#tPhone');
      const paidIn   = el.querySelector('#tPaid');
      const discIn   = el.querySelector('#tDiscount');

      let lineSeq = 0;

      /* ---- line rows ---- */
      function addLine(preset) {
        lineSeq++;
        const tr = document.createElement('tr');
        tr.dataset.line = String(lineSeq);
        tr.innerHTML = `
          <td class="line-no" style="color:var(--text-muted);font-size:12px;padding-left:12px;"></td>
          <td>
            <select class="select line-item" aria-label="Item">
              ${itemOptions(preset && preset.itemId, 'Select item…')}
            </select>
          </td>
          <td><input class="input line-qty" type="number" min="0" step="0.01" value="${preset ? preset.qty : ''}" placeholder="0" aria-label="Quantity"></td>
          <td class="line-unit" style="font-size:12px;color:var(--text-secondary);"></td>
          <td><input class="input line-price" type="number" min="0" step="0.01" value="" placeholder="0.00" aria-label="Price per unit"></td>
          <td><input class="input line-gst" type="number" min="0" step="0.01" value="" placeholder="0" aria-label="GST percent"></td>
          <td class="num-cell line-tax">—</td>
          <td class="num-cell line-amount">—</td>
          <td style="text-align:center;">
            <button class="del-row" type="button" aria-label="Remove this row">${icon('x', 13)}</button>
          </td>`;
        linesEl.appendChild(tr);
        renumber();
        recalc();
        return tr;
      }

      function renumber() {
        Array.from(linesEl.children).forEach((tr, i) => {
          tr.querySelector('.line-no').textContent = String(i + 1);
        });
      }

      function readLines() {
        return Array.from(linesEl.children).map(tr => {
          const itemSel = tr.querySelector('.line-item');
          const it = findItem(itemSel.value);
          const qty   = Number(tr.querySelector('.line-qty').value) || 0;
          const price = Number(tr.querySelector('.line-price').value) || 0;
          const gst   = Number(tr.querySelector('.line-gst').value) || 0;
          const amount = round2(qty * price);
          const taxAmount = round2(amount * gst / 100);
          return { tr, itemId: itemSel.value, item: it, quantity: qty, price, gstRate: gst, amount, taxAmount };
        });
      }

      function recalc() {
        const lines = readLines();

        lines.forEach(l => {
          l.tr.querySelector('.line-tax').textContent = l.itemId && l.quantity ? formatCurrency(l.taxAmount) : '—';
          l.tr.querySelector('.line-amount').textContent = l.itemId && l.quantity ? formatCurrency(l.amount) : '—';
        });

        const subtotal = round2(sum(lines, l => l.amount));
        const tax      = round2(sum(lines, l => l.taxAmount));
        const discount = round2(Number(discIn.value) || 0);
        const raw      = subtotal + tax - discount;
        const total    = Math.round(raw);
        const roundOff = round2(total - raw);
        const paid     = round2(Number(paidIn.value) || 0);
        const balance  = round2(total - paid);

        el.querySelector('#tSubtotal').textContent = formatCurrency(subtotal);
        el.querySelector('#tTax').textContent      = formatCurrency(tax);
        el.querySelector('#tRound').textContent    = formatCurrency(roundOff);
        el.querySelector('#tTotal').textContent    = formatCurrency(total);
        el.querySelector('#tBalance').textContent  = formatCurrency(balance);
        el.querySelector('#tBalance').style.color  = balance > 0 ? 'var(--danger)' : 'var(--success)';

        return { lines, subtotal, tax, discount, roundOff, total, paid, balance };
      }

      /* ---- item selection populates unit + price ---- */
      linesEl.addEventListener('change', e => {
        if (!e.target.classList.contains('line-item')) return;
        const tr = e.target.closest('tr');
        const it = findItem(e.target.value);
        const priceIn = tr.querySelector('.line-price');
        const gstIn   = tr.querySelector('.line-gst');
        const unitCell = tr.querySelector('.line-unit');
        const qtyIn = tr.querySelector('.line-qty');

        if (it) {
          unitCell.textContent = it.unit;
          unitCell.title = `${formatNumber(it.currentStock)} ${it.unit} in stock`;
          priceIn.value = isPurchase ? it.purchasePrice : it.sellingPrice;
          gstIn.value = it.gstRate;
          if (!qtyIn.value) qtyIn.value = 1;
        } else {
          unitCell.textContent = '';
          priceIn.value = '';
          gstIn.value = '';
        }
        recalc();
      });

      linesEl.addEventListener('input', e => {
        if (e.target.matches('.line-qty,.line-price,.line-gst')) recalc();
      });

      linesEl.addEventListener('click', e => {
        const btn = e.target.closest('.del-row');
        if (!btn) return;
        const tr = btn.closest('tr');
        if (linesEl.children.length === 1) {
          // Keep at least one row — just clear it
          tr.querySelector('.line-item').value = '';
          tr.querySelector('.line-qty').value = '';
          tr.querySelector('.line-price').value = '';
          tr.querySelector('.line-gst').value = '';
          tr.querySelector('.line-unit').textContent = '';
        } else {
          tr.remove();
        }
        renumber();
        recalc();
      });

      el.querySelector('#addLine').addEventListener('click', () => addLine(null));
      discIn.addEventListener('input', recalc);
      paidIn.addEventListener('input', recalc);

      /* ---- party selection populates phone ---- */
      partySel.addEventListener('change', () => {
        const p = partyList.find(x => x.id === partySel.value);
        phoneIn.value = p ? (p.phone || '') : '';
      });

      /* ---- submit ---- */
      form.addEventListener('submit', async e => {
        e.preventDefault();
        form.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));

        const summary = recalc();
        const valid = summary.lines.filter(l => l.itemId && l.quantity > 0);

        if (!partySel.value) {
          form.querySelector(`[data-field="${partyField}"]`).classList.add('invalid');
          showToast(`Please select a ${partyLabel.toLowerCase()}`, 'error');
          return;
        }
        if (!valid.length) {
          showToast(`Please add at least one item with a quantity`, 'error');
          return;
        }
        if (valid.some(l => l.quantity < 0)) {
          showToast('Quantity cannot be negative', 'error');
          return;
        }
        if (summary.paid > summary.total) {
          form.querySelector('[data-field="paid"]').classList.add('invalid');
          showToast('Paid amount cannot exceed the total', 'error');
          return;
        }

        const payload = {
          items: valid.map(l => ({
            itemId: l.itemId,
            name: l.item ? l.item.name : '',
            quantity: l.quantity,
            unit: l.item ? l.item.unit : '',
            price: l.price,
            gstRate: l.gstRate,
            taxAmount: l.taxAmount,
            amount: l.amount
          })),
          subtotal: summary.subtotal,
          discount: summary.discount,
          tax: summary.tax,
          roundOff: summary.roundOff,
          total: summary.total,
          paid: summary.paid,
          paymentType: el.querySelector('#tPayType').value,
          notes: el.querySelector('#tNotes').value.trim(),
          date: el.querySelector('#tDate').value || todayISO()
        };

        if (isPurchase) {
          payload.supplierId = partySel.value;
          payload.billNumber = el.querySelector('#tNumber').value.trim() || nextNumber;
        } else {
          payload.customerId = partySel.value;
          payload.invoiceNumber = el.querySelector('#tNumber').value.trim() || nextNumber;
        }

        const submitBtn = document.querySelector('.modal-foot [form="txnForm"]');
        const saved = await withBusyButton(submitBtn,
          isPurchase ? 'Saving purchase…' : 'Saving invoice…',
          () => (isPurchase ? savePurchase(payload) : saveSale(payload)));

        if (!saved.ok) {
          showToast(saved.message, 'error');
          return;
        }

        closeModal();
        showToast(isPurchase ? 'Purchase saved successfully' : 'Invoice saved successfully');
        state.route = isPurchase ? 'purchase-bills' : 'sales-invoices';
        renderSidebar();
        render();
      });

      // Start with three empty rows, like the reference app
      addLine(null); addLine(null); addLine(null);
      partySel.focus();
    }
  });
}

function getFilteredPurchases() {
  const f = state.purchaseFilter;
  const range = resolveRange(f);
  return state.purchases.filter(p => {
    if (!dateInRange(p.date, range)) return false;
    if (f.supplierId && p.supplierId !== f.supplierId) return false;
    if (f.paymentStatus && purchaseStatus(p) !== f.paymentStatus) return false;
    return true;
  }).slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}

function renderPurchaseBills() {
  const f = state.purchaseFilter;
  const rows = getFilteredPurchases();
  const stats = getPurchaseStats(rows);

  document.getElementById('view').innerHTML = `
    <div class="view-inner">

        ${statCard({ tone:'blue',  icon:'clock',  label:'Unpaid', value:formatCurrency(stats.unpaid, true), sub:'Outstanding payables' })}

      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table class="data">
            <thead><tr>
              <th>Date</th><th>Invoice No.</th><th>Supplier</th><th>Payment Type</th>

            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(p => `
                <tr data-id="${p.id}">

                  <td class="mono td-sub">${escapeHtml(p.billNumber)}</td>
                  <td class="td-strong">${escapeHtml(supplierName(p.supplierId))}</td>
                  <td><span class="badge badge-neutral">${escapeHtml(p.paymentType)}</span></td>
                  <td class="num td-strong">${formatCurrency(p.total, true)}</td>
                  <td class="num" style="color:var(--success);font-weight:600;">${formatCurrency(p.paid, true)}</td>

  view.querySelector('#pReset').addEventListener('click', () => {
    state.purchaseFilter = { range:'thisMonth', from:'', to:'', supplierId:'', paymentStatus:'' };
    renderPurchaseBills();
    showToast('Filters reset', 'info');
  });

  view.querySelector('#btnAddPurchase').addEventListener('click', () => openTransactionForm('purchase'));
  view.querySelector('#btnUploadBill').addEventListener('click', () => {
    showToast('Bill upload arrives in a later phase — use Add Purchase for now.', 'info');
  });

  view.querySelector('#pExport').addEventListener('click', () => {
    exportCSV('hisabkit-purchases.csv',
      ['Date','Bill Number','Supplier','Total','Paid','Balance','Payment Type'],
      rows.map(p => [
        formatDate(p.date), p.billNumber, supplierName(p.supplierId),
        p.total, p.paid, p.balance, p.paymentType
      ]));
  });
  view.querySelector('#pPrint').addEventListener('click', () => window.print());

  view.querySelectorAll('[data-pmenu]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.pmenu;
      const p = state.purchases.find(x => x.id === id);
      if (!p) return;
      const actions = [
        { label:'View Bill', icon:'eye', onClick:() => openViewPurchase(id) }
      ];
      if (p.balance > 0) {
        actions.push({ label:'Record Payment', icon:'wallet', onClick:() => openRecordPayment(id) });
      }
      actions.push('---');
      actions.push({ label:'Delete Bill', icon:'trash', danger:true, onClick:() => confirmDeletePurchase(id) });
      openContextMenu(btn, actions);
    });
  });

function openRecordPayment(purchaseId) {

          <label for="payAmount">Amount Paid <span class="req">*</span></label>
          <div class="input-affix">
            <span class="prefix">${currencySymbol()}</span>

                   max="${p.balance}" value="${p.balance}" autofocus>

          <span class="err">Enter an amount between 0 and ${formatCurrency(p.balance)}</span>

      const form = el.querySelector('#payForm');

          () => recordSettlement('purchase', purchaseId, amt, mode.value, todayISO()));

function confirmDeletePurchase(id) {
  const p = state.purchases.find(x => x.id === id);
  if (!p) return;
  const ledgerCount = state.ledger.filter(l => l.reference === p.billNumber && l.type === 'Purchase').length;

  confirmDialog({
    title: 'Delete purchase bill',
    message: `Delete <strong>${escapeHtml(p.billNumber)}</strong> from ${escapeHtml(supplierName(p.supplierId))}?`
      + `<br><br>The stock added by this bill will be reversed`
      + (ledgerCount ? ` (${ledgerCount} ledger entr${ledgerCount > 1 ? 'ies' : 'y'} removed)` : '')
      + `.<br><br>This cannot be undone.`,
    confirmLabel: 'Delete',
    busyLabel: 'Deleting…',
    danger: true,
    async onConfirm() {
      const ops = [];

      // Give back the stock this bill added, then remove every trace of it.
      (p.items || []).forEach(line => {
        const item = findItem(line.itemId);
        if (!item) return;
        ops.push({
          action: 'update', sheet: 'Items', id: item.id,
          data: Object.assign({}, item, { currentStock: round2(item.currentStock - line.quantity) })
        });
      });

      state.ledger
        .filter(l => l.type === 'Purchase' && l.reference === p.billNumber)
        .forEach(l => ops.push({ action: 'delete', sheet: 'Stock_Ledger', id: l.id }));

      (p.items || []).forEach(line =>
        ops.push({ action: 'delete', sheet: 'Purchase_Items', id: line.id }));

      state.payments
        .filter(pay => pay.referenceType === 'Purchase' && pay.referenceId === p.id)
        .forEach(pay => ops.push({ action: 'delete', sheet: 'Payments', id: pay.id }));

      ops.push({ action: 'delete', sheet: 'Purchases', id: p.id });

      try {
        await repoTransaction(ops);
        await syncAll();
        renderPurchaseBills();
        showToast('Purchase deleted and stock returned');
      } catch (err) {
        console.error('[HisabKit] purchase delete failed', err);
        showToast(describeApiError(err, 'The purchase could not be deleted.'), 'error');
      }
    }
  });
}

  const f = state.salesFilter;
  const range = resolveRange(f);
  return state.sales.filter(s => {
    if (!dateInRange(s.date, range)) return false;
    if (f.customerId && s.customerId !== f.customerId) return false;
    return true;
  }).slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}

function confirmDeleteSale(id) {
  const s = state.sales.find(x => x.id === id);
  if (!s) return;

  confirmDialog({
    title: 'Delete invoice',
    message: `Delete invoice <strong>${escapeHtml(s.invoiceNumber)}</strong> for ${escapeHtml(customerName(s.customerId))}?`
      + `<br><br>The stock sold on this invoice will be returned to inventory.`
      + `<br><br>This cannot be undone.`,
    confirmLabel: 'Delete',
    busyLabel: 'Deleting…',
    danger: true,
    async onConfirm() {
      const ops = [];

      // Put the sold stock back, then remove every trace of the invoice.
      (s.items || []).forEach(line => {
        const item = findItem(line.itemId);
        if (!item) return;
        ops.push({
          action: 'update', sheet: 'Items', id: item.id,
          data: Object.assign({}, item, { currentStock: round2(item.currentStock + line.quantity) })
        });
      });

      state.ledger
        .filter(l => l.type === 'Sale' && l.reference === s.invoiceNumber)
        .forEach(l => ops.push({ action: 'delete', sheet: 'Stock_Ledger', id: l.id }));

      (s.items || []).forEach(line =>
        ops.push({ action: 'delete', sheet: 'Sales_Items', id: line.id }));

      state.payments
        .filter(pay => pay.referenceType === 'Sale' && pay.referenceId === s.id)
        .forEach(pay => ops.push({ action: 'delete', sheet: 'Payments', id: pay.id }));

      ops.push({ action: 'delete', sheet: 'Sales', id: s.id });

      try {
        await repoTransaction(ops);
        await syncAll();
        renderSales();
        showToast('Invoice deleted and stock returned');
      } catch (err) {
        console.error('[HisabKit] invoice delete failed', err);
        showToast(describeApiError(err, 'The invoice could not be deleted.'), 'error');
      }
    }
  });

/* ============================================================
   7h. PARTY ACCOUNTS — supplier and customer ledgers

   A party account is derived, never stored. Every figure on it is worked out
   from the party row, the bills or invoices raised against that party, and the
   payments that name it, so the account cannot drift away from the
   transactions the way a saved balance can.

   Which side an entry falls on follows the usual accounting reading:

     supplier   a purchase, and an opening balance payable, increase what is
                owed to the supplier (debit); paying the supplier clears it
                (credit).
     customer   a sale, and an opening balance receivable, increase what the
                customer owes (debit); being paid clears it (credit).

   Outstanding is therefore total debit less total credit, on both sides.
   ============================================================ */

/** 'supplier'/'Supplier'/'suppliers' all mean the same account. */
function normalizePartyKind(partyType) {
  return String(partyType || '').trim().toLowerCase().indexOf('sup') === 0 ? 'supplier' : 'customer';
}

/**
 * Which side of the account the opening balance belongs on. BalanceType is
 * whatever the sheet holds — Payable/Receivable, or Debit/Credit as the party
 * form writes it — and a supplier's payable and a customer's receivable are
 * both money owed to the business, so both land on the debit side. A balance on
 * the other side, a supplier paid in advance or a customer in credit, reduces
 * the outstanding figure instead.
 *
 * A negative opening balance reverses the side, matching the party form's own
 * note that a negative figure means the money is owed the other way.
 */
function partyOpeningSide(kind, balanceType, amount) {
  const type = String(balanceType || '').trim().toLowerCase();
  const against = kind === 'supplier' ? 'receivable' : 'payable';

  let side = (type === 'credit' || type === against) ? 'credit' : 'debit';
  if (Number(amount) < 0) side = side === 'debit' ? 'credit' : 'debit';
  return side;
}

/** The opening balance as a ledger entry, or null when there is none. */
function partyOpeningEntry(kind, party) {
  const amount = round2(Number(party.openingBalance) || 0);
  if (!amount) return null;

  const side = partyOpeningSide(kind, party.balanceType, amount);
  const value = Math.abs(amount);
  const type = String(party.balanceType || '').trim();

  return {
    date: party.createdAt || '',
    type: 'Opening Balance',
    reference: 'OPENING',
    description: 'Balance carried into HisabKit' + (type ? ' (' + type + ')' : ''),
    debit: side === 'debit' ? value : 0,
    credit: side === 'credit' ? value : 0,
    source: kind === 'supplier' ? 'Suppliers' : 'Customers',
    sourceId: party.id,
    documentId: ''
  };
}

/** A purchase bill or sales invoice as a ledger entry. */
function partyDocumentEntry(kind, doc) {
  const buying = kind === 'supplier';
  const number = (buying ? doc.billNumber : doc.invoiceNumber) || doc.id;
  return {
    date: doc.date,
    type: buying ? 'Purchase' : 'Sale',
    reference: number,
    description: (buying ? 'Purchase bill ' : 'Sales invoice ') + number,
    debit: round2(Number(doc.total) || 0),
    credit: 0,
    source: buying ? 'Purchases' : 'Sales',
    sourceId: doc.id,
    documentId: doc.id
  };
}

/**
 * The bill or invoice a payment names, when it names one that exists and
 * belongs to the same party. ReferenceID is optional — a general payment has
 * none, and still belongs in the account.
 */
function linkedDocument(kind, payment) {
  if (!payment.referenceId) return null;

  const buying = kind === 'supplier';
  const wantsSale = String(payment.referenceType || '').trim().toLowerCase() === 'sale';
  if (buying === wantsSale) return null;

  const list = buying ? state.purchases : state.sales;
  const doc = list.find(d => d.id === payment.referenceId) || null;
  if (!doc) return null;
  return ((buying ? doc.supplierId : doc.customerId) === payment.partyId) ? doc : null;
}

/** Every payment that belongs to this party, linked to a document or not. */
function partyPaymentsFor(kind, partyId) {
  const wanted = kind === 'supplier' ? 'supplier' : 'customer';
  return state.payments.filter(p =>
    String(p.partyType || '').trim().toLowerCase() === wanted && p.partyId === partyId);
}

/**
 * A payment as a ledger entry. Paying a supplier, and being paid by a customer,
 * clears what is owed (credit). The same payment type the other way round — a
 * refund, or an advance handed back — adds to it instead (debit).
 */
function partyPaymentEntry(kind, payment) {
  const buying = kind === 'supplier';
  const amount = round2(Number(payment.amount) || 0);
  const clears = buying ? payment.transactionType !== 'Received' : payment.transactionType !== 'Paid';
  const doc = linkedDocument(kind, payment);
  const number = doc ? ((buying ? doc.billNumber : doc.invoiceNumber) || doc.id) : '';

  return {
    date: payment.date,
    type: 'Payment',
    reference: number || payment.id,
    description: (buying ? 'Paid to supplier' : 'Received from customer')
      + (payment.paymentMode ? ' by ' + payment.paymentMode : '')
      + (number ? ' against ' + number : ' — general payment')
      + (payment.notes ? ' — ' + payment.notes : ''),
    debit: clears ? 0 : amount,
    credit: clears ? amount : 0,
    source: 'Payments',
    sourceId: payment.id,
    documentId: doc ? doc.id : ''
  };
}

/**
 * One party's account: the opening balance, every bill, invoice and payment in
 * date order, the running balance on each line, and the totals. The account
 * view and the party lists both read from this, so a supplier and a customer
 * account cannot disagree about the same payment.
 */
function buildPartyAccount(partyType, partyId) {
  const kind = normalizePartyKind(partyType);
  const cfg = partyConfig(kind);
  const party = state[cfg.list].find(p => p.id === partyId);
  if (!party) return null;

  const buying = kind === 'supplier';
  const docs = (buying ? state.purchases : state.sales)
    .filter(d => (buying ? d.supplierId : d.customerId) === partyId);
  const payments = partyPaymentsFor(kind, partyId);

  const entries = [];
  const opening = partyOpeningEntry(kind, party);
  if (opening) entries.push(opening);
  docs.forEach(d => entries.push(partyDocumentEntry(kind, d)));
  payments.forEach(p => entries.push(partyPaymentEntry(kind, p)));

  // Oldest first, with the opening balance ahead of anything dated the same day.
  entries.sort((a, b) => {
    const aOpening = a.type === 'Opening Balance';
    const bOpening = b.type === 'Opening Balance';
    if (aOpening !== bOpening) return aOpening ? -1 : 1;
    if (a.date === b.date) return 0;
    return a.date < b.date ? -1 : 1;
  });

  let running = 0;
  let documentTotal = 0;
  let paymentTotal = 0;

  const transactions = entries.map(entry => {
    running = round2(running + entry.debit - entry.credit);
    if (entry.source === 'Payments') paymentTotal = round2(paymentTotal + entry.credit - entry.debit);
    else if (entry.type !== 'Opening Balance') documentTotal = round2(documentTotal + entry.debit - entry.credit);
    return Object.assign({}, entry, { balance: running });
  });

  const totalDebit = round2(sum(transactions, t => t.debit));
  const totalCredit = round2(sum(transactions, t => t.credit));

  return {
    party:              party,
    kind:               kind,
    partyType:          buying ? 'Supplier' : 'Customer',
    openingBalance:     round2(Number(party.openingBalance) || 0),
    transactions:       transactions,
    totalDebit:         totalDebit,
    totalCredit:        totalCredit,
    documentTotal:      documentTotal,
    documentCount:      docs.length,
    paymentTotal:       paymentTotal,
    paymentCount:       payments.length,
    returnsTotal:       0,
    outstandingBalance: round2(totalDebit - totalCredit)
  };
}

/**
 * Outstanding per party for the party lists. The same classification as the
 * account above, without building a running balance for every row.
 */
function partyOutstandingMap(kind) {
  const cfg = partyConfig(kind);
  const buying = kind === 'supplier';
  const map = Object.create(null);

  state[cfg.list].forEach(party => {
    const opening = partyOpeningEntry(kind, party);
    map[party.id] = opening ? round2(opening.debit - opening.credit) : 0;
  });

  (buying ? state.purchases : state.sales).forEach(doc => {
    const id = buying ? doc.supplierId : doc.customerId;
    if (map[id] === undefined) return;
    const entry = partyDocumentEntry(kind, doc);
    map[id] = round2(map[id] + entry.debit - entry.credit);
  });

  state.payments.forEach(payment => {
    const wanted = buying ? 'supplier' : 'customer';
    if (String(payment.partyType || '').trim().toLowerCase() !== wanted) return;
    if (map[payment.partyId] === undefined) return;
    const entry = partyPaymentEntry(kind, payment);
    map[payment.partyId] = round2(map[payment.partyId] + entry.debit - entry.credit);
  });

  return map;
}

/** How an outstanding figure reads. */
function outstandingLabel(kind, amount) {
  const value = round2(amount);
  if (value === 0) return 'Settled';
  if (value > 0) return kind === 'supplier' ? 'You owe' : 'Owed to you';
  return kind === 'supplier' ? 'Paid in advance' : 'Customer in credit';
}

/** Colour for an outstanding figure: red while owed, green once settled or in credit. */
function outstandingTone(amount) {
  const value = round2(amount);
  if (value === 0) return 'var(--text-secondary)';
  return value > 0 ? 'var(--danger)' : 'var(--success)';
}

/**
 * The account view: the party, the summary, and the full transaction ledger.
 * Filters narrow the rows on screen; the running balance and the totals always
 * come from the whole account, so a filtered view can never change what is owed.
 */
function openPartyAccount(kind, id) {
  const account = buildPartyAccount(kind, id);
  if (!account) return;

  const buying = kind === 'supplier';
  const party = account.party;
  const filter = { from: '', to: '', type: '', ref: '' };
  const typeChoices = ['Opening Balance', buying ? 'Purchase' : 'Sale', 'Payment'];

  function filtered() {
    return account.transactions.filter(t => {
      if (filter.from && t.date < filter.from) return false;
      if (filter.to && t.date > filter.to) return false;
      if (filter.type && t.type !== filter.type) return false;
      if (filter.ref) {
        const haystack = [t.reference, t.description, t.sourceId, t.type].join(' ').toLowerCase();
        if (haystack.indexOf(filter.ref.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  function tableHtml() {
    const rows = filtered();
    const shell = inner => `<div class="table-scroll"
      style="border:1px solid var(--border);border-radius:var(--radius);"><table class="data">${inner}</table></div>`;

    if (!rows.length) {
      return shell(`<tbody>${emptyRow(7, 'No transactions', account.transactions.length
        ? 'No transaction matches these filters.'
        : `No ${buying ? 'purchases' : 'sales'} or payments recorded for this party yet.`)}</tbody>`);
    }

    return shell(`
      <thead><tr>
        <th>Date</th><th>Type</th><th>Reference</th><th>Description</th>
        <th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th>
      </tr></thead>
      <tbody>
        ${rows.map(t => `
          <tr ${t.documentId ? `data-doc="${escapeHtml(t.documentId)}" tabindex="0" style="cursor:pointer;"` : ''}>
            <td>${t.date ? formatDate(t.date) : '—'}</td>
            <td>${escapeHtml(t.type)}</td>
            <td class="mono td-sub">${escapeHtml(t.reference)}</td>
            <td class="td-sub">${escapeHtml(t.description)}</td>
            <td class="num">${t.debit ? formatCurrency(t.debit) : '—'}</td>
            <td class="num" style="color:${t.credit ? 'var(--success)' : 'inherit'};">${t.credit ? formatCurrency(t.credit) : '—'}</td>
            <td class="num td-strong" style="color:${outstandingTone(t.balance)};">${formatCurrency(t.balance)}</td>
          </tr>`).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4" class="td-sub">Showing ${rows.length} of ${account.transactions.length}</td>
          <td class="num td-strong">${formatCurrency(round2(sum(rows, t => t.debit)))}</td>
          <td class="num td-strong">${formatCurrency(round2(sum(rows, t => t.credit)))}</td>
          <td class="num td-strong" style="color:${outstandingTone(account.outstandingBalance)};">${formatCurrency(account.outstandingBalance)}</td>
        </tr>
      </tfoot>`);
  }

  openModal({
    title: `${party.name} — ${account.partyType} Account`,
    size: 'xl',
    body: `
      <div style="display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:18px;">
        <div>
          <div class="td-strong" style="font-size:15px;">${escapeHtml(party.name)}</div>
          <div class="td-sub" style="margin-top:4px;">
            ${escapeHtml(party.phone || 'No phone')} · ${escapeHtml(party.email || 'No email')} · ${escapeHtml(party.gstin || 'No GSTIN')}
          </div>
          ${party.address ? `<div class="td-sub">${escapeHtml(party.address)}</div>` : ''}
          <div class="td-sub">Opening balance ${formatCurrency(account.openingBalance)} · Credit limit ${formatCurrency(party.creditLimit || 0)}</div>
        </div>
        <div style="text-align:right;">
          <div class="stat-label">Current Outstanding</div>
          <div class="stat-value" style="color:${outstandingTone(account.outstandingBalance)};">
            ${formatCurrency(account.outstandingBalance)}
          </div>
          <div class="stat-sub">${outstandingLabel(kind, account.outstandingBalance)}</div>
        </div>
      </div>

      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px;">
        ${statCard({ tone:'amber', icon:'wallet', label:'Opening Balance',
                     value: formatCurrency(account.openingBalance),
                     sub: account.openingBalance ? 'Carried forward' : 'None' })}
        ${statCard({ tone:'blue', icon:'receipt', label: buying ? 'Total Purchases' : 'Total Sales',
                     value: formatCurrency(account.documentTotal),
                     sub: account.documentCount + ' document' + (account.documentCount === 1 ? '' : 's') })}
        ${statCard({ tone:'green', icon:'check', label: buying ? 'Total Payments Made' : 'Total Payments Received',
                     value: formatCurrency(account.paymentTotal),
                     sub: account.paymentCount + ' payment' + (account.paymentCount === 1 ? '' : 's') })}
        ${statCard({ tone: account.outstandingBalance > 0 ? 'red' : 'green', icon:'clock', label:'Outstanding',
                     value: formatCurrency(account.outstandingBalance),
                     sub: outstandingLabel(kind, account.outstandingBalance) })}
      </div>

      <div class="filter-bar no-print">
        <div class="filter-group">
          <label for="acctFrom">Date From</label>
          <input class="input w-140" id="acctFrom" type="date" value="">
        </div>
        <div class="filter-group">
          <label for="acctTo">Date To</label>
          <input class="input w-140" id="acctTo" type="date" value="">
        </div>
        <div class="filter-group">
          <label for="acctType">Type</label>
          <select class="select w-170" id="acctType">
            <option value="">All Types</option>
            ${typeChoices.map(t => `<option value="${t}">${t}</option>`).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label for="acctRef">Reference</label>
          <input class="input w-170" id="acctRef" type="search" placeholder="Bill, invoice, payment…">
        </div>
        <div class="filter-actions">
          <button class="btn btn-ghost btn-sm" id="acctReset">${icon('reset', 14)} Reset</button>
        </div>
      </div>

      <div id="acctTable">${tableHtml()}</div>
      <p class="td-sub" style="margin-top:10px;">
        Debit increases what ${buying ? 'you owe the supplier' : 'the customer owes you'};
        credit reduces it. Click a purchase, sale or payment against a document to open it.
      </p>`,
    footer: `
      <button class="btn btn-default" type="button" data-modal-close>Close</button>
      <button class="btn btn-primary" type="button" id="acctPay">${icon('wallet', 15)} Record Payment</button>`,
    onMount(el) {
      const body = el.querySelector('#acctTable');

      function redraw() {
        body.innerHTML = tableHtml();
        body.querySelectorAll('[data-doc]').forEach(row => {
          const show = () => openDocumentView(kind, row.dataset.doc);
          row.addEventListener('click', show);
          row.addEventListener('keydown', e => { if (e.key === 'Enter') show(); });
        });
      }

      function reread() {
        filter.from = el.querySelector('#acctFrom').value;
        filter.to = el.querySelector('#acctTo').value;
        filter.type = el.querySelector('#acctType').value;
        filter.ref = el.querySelector('#acctRef').value.trim();
        redraw();
      }

      ['#acctFrom', '#acctTo', '#acctType'].forEach(sel =>
        el.querySelector(sel).addEventListener('change', reread));
      el.querySelector('#acctRef').addEventListener('input', debounce(reread, 200));
      el.querySelector('#acctReset').addEventListener('click', () => {
        el.querySelector('#acctFrom').value = '';
        el.querySelector('#acctTo').value = '';
        el.querySelector('#acctType').value = '';
        el.querySelector('#acctRef').value = '';
        reread();
      });

      el.querySelector('#acctPay').addEventListener('click', () => {
        openPaymentForm({
          partyType: account.partyType,
          partyId: party.id,
          amount: Math.max(0, account.outstandingBalance),
          onSaved() {

    }
  });
}

function confirmDeleteParty(kind, id) {
  const cfg = partyConfig(kind);
  const party = state[cfg.list].find(p => p.id === id);
  if (!party) return;

  const isSupplier = kind === 'supplier';
  const linked = (isSupplier ? state.purchases : state.sales)
    .filter(t => (isSupplier ? t.supplierId : t.customerId) === id).length;
  const payments = state.payments.filter(p => p.partyId === id).length;
  const sheetName = isSupplier ? 'Suppliers' : 'Customers';

  const blockers = [];
  if (linked) blockers.push(linked + ' ' + (isSupplier ? 'purchase' : 'sale') + (linked === 1 ? '' : 's'));
  if (payments) blockers.push(payments + ' payment' + (payments === 1 ? '' : 's'));

  confirmDialog({
    title: `Delete ${cfg.label.toLowerCase()}`,
    message: blockers.length
      ? `<strong>${escapeHtml(party.name)}</strong> cannot be deleted.<br><br>It is used by ${blockers.join(' and ')}. Set the status to Inactive instead.`
      : `Delete <strong>${escapeHtml(party.name)}</strong>?<br><br>This cannot be undone.`,
    confirmLabel: blockers.length ? 'Close' : 'Delete',
    danger: !blockers.length,
    async onConfirm() {
      if (blockers.length) return;
      try {
        await repoDelete(sheetName, id);
        render();
        showToast(`${cfg.label} deleted successfully`);
      } catch (err) {
        console.error('[HisabKit] delete ' + kind + ' failed', err);
        showToast(describeApiError(err, `The ${cfg.label.toLowerCase()} could not be deleted.`), 'error');
      }
    }
  });
}

/**
 * Categories are real records in the Categories sheet, not just the distinct
 * values found on items, so they can be added and renamed before any item
 * uses them. The item counts beside each one are still derived from Items.
 */
function renderCategories() {
  const statsByCategory = {};
  state.items.forEach(it => {
    const c = it.category || 'Uncategorised';
    if (!statsByCategory[c]) statsByCategory[c] = { count:0, value:0, low:0, out:0 };
    statsByCategory[c].count++;
    statsByCategory[c].value += itemStockValue(it);
    const st = calculateStockStatus(it);
    if (st === 'Low Stock') statsByCategory[c].low++;
    if (st === 'Out of Stock') statsByCategory[c].out++;
  });

  // Anything used by an item but missing from the sheet is still shown, so no
  // stock is ever hidden from this page.
  const known = new Set(state.categories.map(c => c.name));
  const orphanNames = Object.keys(statsByCategory).filter(n => !known.has(n));

  const rows = state.categories.map(c => Object.assign(
    { record: c, name: c.name, status: c.status || 'Active', description: c.description || '' },
    statsByCategory[c.name] || { count:0, value:0, low:0, out:0 }
  )).concat(orphanNames.map(n => Object.assign(
    { record: null, name: n, status: 'Not in sheet', description: '' },
    statsByCategory[n]
  )));

  rows.sort((a, b) => b.value - a.value);

  document.getElementById('view').innerHTML = `
    <div class="view-inner">
      <div class="page-head">
        <div>
          <h2>Categories</h2>
          <p>Groupings for your items, stored in the Categories sheet.</p>
        </div>
        <div class="page-head-actions">
          <button class="btn btn-default" id="catExport">${icon('download', 15)} Export</button>
          <button class="btn btn-primary" id="catNew">${icon('plus', 15)} Add Category</button>
        </div>
      </div>

      <div class="stat-grid">
        ${statCard({ tone:'blue',  icon:'filter', label:'Categories',    value:formatNumber(state.categories.length), sub:'In the sheet' })}
        ${statCard({ tone:'green', icon:'check',  label:'Active',        value:formatNumber(state.categories.filter(c => (c.status||'Active').toLowerCase() !== 'inactive').length), sub:'Selectable on items' })}
        ${statCard({ tone:'amber', icon:'inventory', label:'Categorised Items', value:formatNumber(state.items.filter(i => i.category).length), sub:`of ${formatNumber(state.items.length)} items` })}
      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table class="data">
            <thead><tr>
              <th>Category</th><th>Description</th><th>Status</th>
              <th class="num">Items</th><th class="num">Stock Value</th>
              <th class="num">Low Stock</th><th class="num">Out of Stock</th><th class="td-actions">Actions</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(c => `
                <tr>
                  <td class="td-strong">${escapeHtml(c.name)}</td>
                  <td class="td-sub">${escapeHtml(c.description || '—')}</td>
                  <td>${c.status.toLowerCase() === 'active'
                        ? '<span class="badge badge-active">Active</span>'
                        : `<span class="badge">${escapeHtml(c.status)}</span>`}</td>
                  <td class="num">${formatNumber(c.count)}</td>
                  <td class="num td-strong">${formatCurrency(c.value)}</td>
                  <td class="num">${c.low ? `<span class="badge badge-lowstock">${c.low}</span>` : '—'}</td>
                  <td class="num">${c.out ? `<span class="badge badge-outstock">${c.out}</span>` : '—'}</td>
                  <td class="td-actions">
                    <div style="display:flex;gap:6px;justify-content:flex-end;">
                      <button class="btn btn-default btn-sm" data-catview="${escapeHtml(c.name)}">View Items</button>
                      ${c.record ? `<button class="icon-btn" data-catmenu="${escapeHtml(c.record.id)}" aria-label="Category actions">${icon('more', 16)}</button>` : ''}
                    </div>
                  </td>
                </tr>`).join('') : emptyRow(8, 'No categories yet', 'Add your first category to group your items.')}
            </tbody>
          </table>
        </div>
        <div class="table-foot">
          <span class="foot-info"><strong>${rows.length}</strong> categor${rows.length === 1 ? 'y' : 'ies'}</span>
        </div>
      </div>
    </div>`;

  const view = document.getElementById('view');
  view.querySelector('#catNew').addEventListener('click', () => openCategoryForm(null));
  view.querySelector('#catExport').addEventListener('click', () => {
    exportCSV('hisabkit-categories.csv',
      ['Category','Description','Status','Items','Stock Value','Low Stock','Out of Stock'],
      rows.map(c => [c.name, c.description, c.status, c.count, c.value, c.low, c.out]));
  });
  view.querySelectorAll('[data-catview]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.inventory.category = btn.dataset.catview;

        '---',

      ]);
    });
  });

/** Add (id = null) or edit a category. */
function openCategoryForm(id) {
  const existing = id ? state.categories.find(c => c.id === id) : null;
  const isEdit = !!existing;
  const d = existing || { name:'', description:'', status:'Active' };

  openModal({
    title: isEdit ? 'Edit Category' : 'Add Category',
    body: `
      <form id="categoryForm" novalidate>
        <div class="form-grid">
          <div class="field span-2" data-field="name">
            <label for="cName">Category Name <span class="req">*</span></label>
            <input class="input" id="cName" name="name" value="${escapeHtml(d.name)}"
                   placeholder="e.g. Copper Pipes" autocomplete="off">
            <span class="err">Category name is required</span>
          </div>
          <div class="field span-2">
            <label for="cDesc">Description</label>
            <textarea class="textarea" id="cDesc" name="description"
                      placeholder="Optional">${escapeHtml(d.description)}</textarea>
          </div>
          <div class="field span-2">
            <label for="cStatus">Status</label>
            <select class="select" id="cStatus" name="status">
              <option value="Active" ${(d.status || 'Active') === 'Active' ? 'selected' : ''}>Active</option>
              <option value="Inactive" ${d.status === 'Inactive' ? 'selected' : ''}>Inactive</option>
            </select>
            <span class="hint">Inactive categories stay on existing items but are not offered on new ones.</span>
          </div>
        </div>
      </form>`,
    footer: `
      <button class="btn btn-default" type="button" data-modal-close>Cancel</button>
      <button class="btn btn-primary" type="submit" form="categoryForm">
        ${icon('check', 15)} ${isEdit ? 'Update Category' : 'Save Category'}
      </button>`,
    onMount(el) {
      const form = el.querySelector('#categoryForm');
      el.querySelector('#cName').focus();

      form.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(form);
        const data = {
          name: (fd.get('name') || '').trim(),
          description: (fd.get('description') || '').trim(),
          status: fd.get('status') || 'Active'
        };

        form.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));
        if (!data.name) {
          form.querySelector('[data-field="name"]').classList.add('invalid');
          showToast('Please fill all required fields', 'error');
          return;
        }
        if (state.categories.some(c => c.name.toLowerCase() === data.name.toLowerCase() && c.id !== id)) {
          form.querySelector('[data-field="name"]').classList.add('invalid');
          showToast('That category already exists', 'error');
          return;
        }

        const button = el.querySelector('.modal-foot button[type="submit"]');
        withBusyButton(button, isEdit ? 'Updating…' : 'Saving…', async () => {
          try {
            if (isEdit) {
              await repoUpdate('Categories', id, data);
              showToast('Category updated successfully');
            } else {
              await repoCreate('Categories', Object.assign({ id: nextId('Categories') }, data));
              showToast('Category added successfully');
            }
            closeModal();
            render();
          } catch (err) {
            console.error('[HisabKit] saving category failed', err);
            showToast(describeApiError(err, 'The category could not be saved.'), 'error');
          }
        });
      });
    }
  });
}

/** A category in use by items cannot be deleted — it is offered Inactive instead. */
function confirmDeleteCategory(id) {
  const category = state.categories.find(c => c.id === id);
  if (!category) return;

  const used = state.items.filter(i => (i.category || '') === category.name).length;

  confirmDialog({
    title: 'Delete category',
    message: used
      ? `<strong>${escapeHtml(category.name)}</strong> is used by <strong>${used}</strong> item${used === 1 ? '' : 's'} and cannot be deleted. Set its status to Inactive instead.`
      : `Delete <strong>${escapeHtml(category.name)}</strong>?<br><br>This cannot be undone.`,
    confirmLabel: used ? 'Close' : 'Delete',
    danger: !used,
    async onConfirm() {
      if (used) return;
      try {
        await repoDelete('Categories', id);
        render();
        showToast('Category deleted successfully');
      } catch (err) {
        console.error('[HisabKit] delete category failed', err);
        showToast(describeApiError(err, 'The category could not be deleted.'), 'error');
      }
    }
  });
}

function renderStockReport() {
  const f = state.reportFilter;
  const range = { from: f.from || '', to: f.to || '' };

  const items = state.items.filter(it => {
    if (f.category && it.category !== f.category) return false;
    if (f.itemId && it.id !== f.itemId) return false;
    return true;
  });

  const rows = items.map(it => {
    const entries = state.ledger.filter(l => l.itemId === it.id);

    // Balance immediately before the range start = opening
    let opening = 0;
    entries.forEach(l => { if (range.from && l.date < range.from) opening += ledgerDelta(l); });
    if (!range.from && entries.length) {
      // No start date — fall back to the item's recorded opening stock
      opening = it.openingStock || 0;
    }

    let inQty = 0, outQty = 0;
    entries.forEach(l => {
      if (!dateInRange(l.date, range)) return;
      inQty  += Number(l.quantityIn)  || 0;
      outQty += Number(l.quantityOut) || 0;
    });

    const closing = round2(opening + inQty - outQty);
    return {
      item: it,
      opening: round2(opening),
      inQty: round2(inQty),
      outQty: round2(outQty),
      closing,
      value: round2(closing * (it.purchasePrice || 0))
    };
  });

  const totalValue = round2(sum(rows, r => r.value));
  const totalIn = round2(sum(rows, r => r.inQty));
  const totalOut = round2(sum(rows, r => r.outQty));

  document.getElementById('reportBody').innerHTML = `
    <div class="filter-bar no-print">
      <div class="filter-group">
        <label for="rFrom">Date From</label>
        <input class="input w-140" id="rFrom" type="date" value="${f.from}">
      </div>
      <div class="filter-group">
        <label for="rTo">Date To</label>
        <input class="input w-140" id="rTo" type="date" value="${f.to}">
      </div>
      <div class="filter-group">
        <label for="rCategory">Category</label>
        <select class="select w-170" id="rCategory">${categoryOptions(f.category, true)}</select>
      </div>
      <div class="filter-group">
        <label for="rItem">Item</label>
        <select class="select w-220" id="rItem">${itemOptions(f.itemId, 'All Items')}</select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-ghost btn-sm" id="rReset">${icon('reset', 14)} Reset</button>
        <button class="btn btn-default btn-sm" id="rExport">${icon('download', 14)} Export CSV</button>
        <button class="btn btn-default btn-sm" id="rPrint">${icon('print', 14)} Print</button>
      </div>
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
      ${statCard({ tone:'blue',  icon:'box',      label:'Closing Stock Value', value:formatCurrency(totalValue), sub:`${rows.length} item(s)` })}
      ${statCard({ tone:'green', icon:'arrowUp',  label:'Total Stock In',      value:formatNumber(totalIn),      sub:'Units received' })}
      ${statCard({ tone:'red',   icon:'arrowDown',label:'Total Stock Out',     value:formatNumber(totalOut),     sub:'Units issued' })}
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table class="data">
          <thead><tr>
            <th>Item</th><th>Category</th>
            <th class="num">Opening Stock</th><th class="num">Stock In</th>
            <th class="num">Stock Out</th><th class="num">Closing Stock</th>
            <th class="num">Stock Value</th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr>
                <td class="td-strong">${escapeHtml(r.item.name)}
                  <div class="td-sub mono">${escapeHtml(r.item.sku || '—')}</div>
                </td>
                <td>${escapeHtml(r.item.category || '—')}</td>
                <td class="num">${formatNumber(r.opening)}</td>
                <td class="num" style="color:var(--success);font-weight:600;">${r.inQty ? '+' + formatNumber(r.inQty) : '—'}</td>
                <td class="num" style="color:var(--danger);font-weight:600;">${r.outQty ? '−' + formatNumber(r.outQty) : '—'}</td>
                <td class="num td-strong">${formatNumber(r.closing)}</td>
                <td class="num td-strong">${formatCurrency(r.value)}</td>
              </tr>`).join('') : emptyRow(7, 'No data', 'Adjust the filters to see stock movement.')}
          </tbody>
        </table>
      </div>
      <div class="table-foot">
        <span class="foot-info">
          Closing stock value <strong>${formatCurrency(totalValue)}</strong>
          ${f.from || f.to ? ` · ${f.from ? formatDate(f.from) : 'start'} → ${f.to ? formatDate(f.to) : 'today'}` : ' · all time'}
        </span>
      </div>
    </div>`;

  const body = document.getElementById('reportBody');
  body.querySelector('#rFrom').addEventListener('change', e => { state.reportFilter.from = e.target.value; renderStockReport(); });
  body.querySelector('#rTo').addEventListener('change', e => { state.reportFilter.to = e.target.value; renderStockReport(); });
  body.querySelector('#rCategory').addEventListener('change', e => { state.reportFilter.category = e.target.value; renderStockReport(); });
  body.querySelector('#rItem').addEventListener('change', e => { state.reportFilter.itemId = e.target.value; renderStockReport(); });
  body.querySelector('#rReset').addEventListener('click', () => {
    state.reportFilter = { from:'', to:'', category:'', itemId:'' };
    renderStockReport();
    showToast('Filters reset', 'info');
  });
  body.querySelector('#rPrint').addEventListener('click', () => window.print());
  body.querySelector('#rExport').addEventListener('click', () => {
    exportCSV('hisabkit-stock-report.csv',
      ['Item','SKU','Category','Opening Stock','Stock In','Stock Out','Closing Stock','Stock Value'],
      rows.map(r => [r.item.name, r.item.sku, r.item.category, r.opening, r.inQty, r.outQty, r.closing, r.value]));
  });
}

function getFilteredPayments() {
  const f = state.paymentFilter;
  return state.payments.filter(p => {
    if (f.partyType && p.partyType !== f.partyType) return false;
    if (f.transactionType && p.transactionType !== f.transactionType) return false;
    if (f.from && p.date < f.from) return false;
    if (f.to && p.date > f.to) return false;
    return true;
  }).slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}

function paymentPartyName(p) {
  return p.partyType === 'Supplier' ? supplierName(p.partyId) : customerName(p.partyId);
}

function paymentReference(p) {
  if (!p.referenceId) return p.notes || '—';
  const doc = p.referenceType === 'Purchase'
    ? state.purchases.find(x => x.id === p.referenceId)
    : state.sales.find(x => x.id === p.referenceId);
  if (!doc) return p.referenceId;
  return (p.referenceType === 'Purchase' ? doc.billNumber : doc.invoiceNumber) || p.referenceId;
}

            <option value="">All</option>
            ${['Customer','Supplier'].map(t => `<option value="${t}" ${f.partyType === t ? 'selected' : ''}>${t}</option>`).join('')}

        </div>

          <select class="select w-140" id="payTxnType">

            ${['Received','Paid'].map(t => `<option value="${t}" ${f.transactionType === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label for="payFrom">Date From</label>
          <input class="input w-140" id="payFrom" type="date" value="${f.from}">
        </div>

        <div class="filter-actions">
          <button class="btn btn-ghost btn-sm" id="payReset">${icon('reset', 14)} Reset</button>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table class="data">

              <th>Date</th><th>Payment ID</th><th>Party</th><th>Party Type</th>
              <th>Against</th><th>Mode</th><th class="num">Amount</th><th>Notes</th>

  view.querySelector('#payExport').addEventListener('click', () => {
    exportCSV('hisabkit-payments.csv',
      ['Date','Payment ID','Party','Party Type','Against','Mode','Transaction','Amount','Notes'],
      rows.map(p => [
        formatDate(p.date), p.id, paymentPartyName(p), p.partyType, paymentReference(p),
        p.paymentMode, p.transactionType, p.amount, p.notes
      ]));
  });

  view.querySelectorAll('[data-paymenu]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.paymenu;
      openContextMenu(btn, [
        { label:'Delete Payment', icon:'trash', danger:true, onClick:() => confirmDeletePayment(id) }
      ]);
    });
  });
}

          </div>
          <span class="err">Enter an amount greater than zero</span>
        </div>
        <div class="field">
          <label for="pmMode">Payment Mode</label>
          <select class="select" id="pmMode">${PAYMENT_MODES.map(m => `<option value="${m}">${m}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label for="pmTxnType">Transaction Type</label>
          <input class="input" id="pmTxnType" value="Received" readonly style="background:var(--background);">
        </div>
        <div class="field">
          <label for="pmNotes">Notes</label>
          <input class="input" id="pmNotes" autocomplete="off" placeholder="Reference, cheque number…">
        </div>
      </div>
    </form>`;

  openModal({
    title: 'Record Payment',
    size: 'lg',
    body,
    footer: `
      <button class="btn btn-default" type="button" data-modal-close>Cancel</button>
      <button class="btn btn-primary" type="submit" form="pmtForm">${icon('check', 15)} Save Payment</button>`,
    onMount(el) {
      const form      = el.querySelector('#pmtForm');
      const typeSel   = el.querySelector('#pmPartyType');
      const partySel  = el.querySelector('#pmParty');
      const refSel    = el.querySelector('#pmReference');
      const txnInput  = el.querySelector('#pmTxnType');
      const amountIn  = el.querySelector('#pmAmount');

      /** The party's unpaid documents, newest first. */
      function openDocuments(partyType, partyId) {
        const buying = partyType === 'Supplier';
        const list = (buying ? state.purchases : state.sales)
          .filter(d => (buying ? d.supplierId : d.customerId) === partyId && d.balance > 0)
          .sort((a, b) => (a.date < b.date ? 1 : -1));
        return list.map(d => ({
          doc: d,
          label: (buying ? d.billNumber : d.invoiceNumber) + ' · due ' + formatCurrency(d.balance)
        }));
      }

      function refreshParties() {
        const buying = typeSel.value === 'Supplier';
        const list = buying ? state.suppliers : state.customers;

        partySel.innerHTML = list.length
          ? `<option value="">Select ${buying ? 'supplier' : 'customer'}…</option>` +
            list.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')
          : `<option value="">No ${buying ? 'suppliers' : 'customers'} yet</option>`;

        txnInput.value = buying ? 'Paid' : 'Received';
        refreshReferences();
      }

      function refreshReferences() {
        const docs = partySel.value ? openDocuments(typeSel.value, partySel.value) : [];
        refSel.innerHTML = `<option value="">Not against a document</option>` +
          docs.map(d => `<option value="${d.doc.id}">${escapeHtml(d.label)}</option>`).join('');
        amountIn.value = 0;
      }

      typeSel.addEventListener('change', refreshParties);
      partySel.addEventListener('change', refreshReferences);
      refSel.addEventListener('change', () => {
        const docs = openDocuments(typeSel.value, partySel.value);
        const chosen = docs.find(d => d.doc.id === refSel.value);
        amountIn.value = chosen ? chosen.doc.balance : 0;
      });

      refreshParties();

      // Opened for a particular party: fill in the party, and the amount owed.
      if (options.partyType) typeSel.value = options.partyType === 'Supplier' ? 'Supplier' : 'Customer';
      refreshParties();
      if (options.partyId) partySel.value = options.partyId;
      refreshReferences();
      if (options.amount) amountIn.value = round2(options.amount);

      amountIn.focus();

      form.addEventListener('submit', async e => {
        e.preventDefault();
        form.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));

        const amount = round2(Number(amountIn.value) || 0);
        if (!partySel.value) {
          form.querySelector('[data-field="party"]').classList.add('invalid');
          showToast('Please select a party', 'error');
          return;
        }
        if (amount <= 0) {
          form.querySelector('[data-field="amount"]').classList.add('invalid');
          showToast('Enter an amount greater than zero', 'error');
          return;
        }

        const btn = document.querySelector('.modal-foot [form="pmtForm"]');
        const res = await withBusyButton(btn, 'Saving payment…', () => savePayment({
          partyType: typeSel.value,
          partyId: partySel.value,
          referenceId: refSel.value,
          amount: amount,
          date: el.querySelector('#pmDate').value || todayISO(),
          paymentMode: el.querySelector('#pmMode').value,
          notes: el.querySelector('#pmNotes').value.trim()
        }));

        if (!res.ok) { showToast(res.message, 'error'); return; }

        if (typeof options.onSaved === 'function') { options.onSaved(); return; }

        closeModal();
        showToast('Payment recorded successfully');
        render();
      });
    }
  });
}

/**
 * Write a payment, and settle the bill it is recorded against. Both rows go in
 * one batch, so the payments list and the bill always agree.
 */
async function savePayment(fields) {
  const buying = fields.partyType === 'Supplier';
  const ops = [{
    action: 'create',
    sheet: 'Payments',
    id: nextId('Payments'),
    data: {
      date: fields.date || todayISO(),
      partyType: fields.partyType,
      partyId: fields.partyId,
      referenceType: fields.referenceId ? (buying ? 'Purchase' : 'Sale') : '',
      referenceId: fields.referenceId || '',
      amount: round2(fields.amount),
      paymentMode: fields.paymentMode || 'Cash',
      transactionType: buying ? 'Paid' : 'Received',
      notes: fields.notes || ''
    }
  }];

  if (fields.referenceId) {
    const list = buying ? state.purchases : state.sales;
    const doc = list.find(d => d.id === fields.referenceId);
    if (!doc) return { ok: false, message: 'That bill is no longer loaded. Reload the page and try again.' };
    if (round2(fields.amount) > round2(doc.balance)) {
      return { ok: false, message: 'The amount cannot be more than the balance due of ' + formatCurrency(doc.balance) + '.' };
    }

    const paid = round2(doc.paid + fields.amount);
    const updated = Object.assign({}, doc, { paid: paid, balance: round2(doc.total - paid) });
    updated.paymentStatus = purchaseStatus(updated);
    ops.push({ action: 'update', sheet: buying ? 'Purchases' : 'Sales', id: doc.id, data: updated });
  }

  try {
    await repoTransaction(ops);
    await syncAll();
    return { ok: true };
  } catch (err) {
    console.error('[HisabKit] payment save failed', err);
    return { ok: false, message: describeApiError(err, 'Payment could not be saved.') };
  }
}

function confirmDeletePayment(id) {
  const p = state.payments.find(x => x.id === id);
  if (!p) return;

  confirmDialog({
    title: 'Delete payment',
    message: `Delete payment <strong>${escapeHtml(p.id)}</strong> of ${formatCurrency(p.amount)}?`
      + `<br><br>If it was recorded against a bill, that bill's paid amount is reduced by the same figure.`,
    confirmLabel: 'Delete',
    busyLabel: 'Deleting…',
    danger: true,
    async onConfirm() {
      const ops = [{ action: 'delete', sheet: 'Payments', id: p.id }];

      // Take the money back off the bill it settled, so the two stay in step.
      const doc = p.referenceType === 'Purchase'
        ? state.purchases.find(x => x.id === p.referenceId)
        : state.sales.find(x => x.id === p.referenceId);

      if (doc) {
        const paid = round2(Math.max(0, doc.paid - p.amount));
        const updated = Object.assign({}, doc, { paid: paid, balance: round2(doc.total - paid) });
        updated.paymentStatus = purchaseStatus(updated);
        ops.push({
          action: 'update',
          sheet: p.referenceType === 'Purchase' ? 'Purchases' : 'Sales',
          id: doc.id, data: updated
        });
      }

      try {
        await repoTransaction(ops);
        await syncAll();
        render();
        showToast('Payment deleted successfully');
      } catch (err) {
        console.error('[HisabKit] payment delete failed', err);
        showToast(describeApiError(err, 'The payment could not be deleted.'), 'error');
      }
    }
  });
}

/** The sheet row holding a setting, or null when the sheet has none yet. */
function settingRow(key) {
  const wanted = String(key).toLowerCase();
  return state.settingRows.find(r => String(r.SettingKey || '').trim().toLowerCase() === wanted) || null;
}

/**
 * Write every setting to the Settings sheet as one batch: rows that already
 * exist are updated in place, keys the sheet is missing are created. The sheet
 * stays the source of truth, so the values survive a reload on any device.
 */
async function saveSettings(values) {
  const ops = [];
  let seq = highestSuffix('Settings');

  SETTING_DEFS.forEach(def => {
    const value = String(values[def.field] === undefined || values[def.field] === null ? '' : values[def.field]);
    const row = settingRow(def.key);
    const data = {
      SettingKey: def.key,
      SettingValue: value,
      Description: def.label,
      Status: 'Active'
    };

    if (row && row.SettingID) {
      ops.push({ action: 'update', sheet: 'Settings', id: String(row.SettingID).trim(), data: data });
    } else {
      seq += 1;
      ops.push({
        action: 'create', sheet: 'Settings',
        id: SHEETS.Settings.prefix + String(seq).padStart(3, '0'),
        data: data
      });
    }
  });

  try {
    await repoTransaction(ops);
    await syncAll();
    state.settings = Object.assign({}, state.settings, values);
    state.settings.lowStockAlert = cellBool(state.settings.lowStockAlert);
    state.settings.taxEnabled = cellBool(state.settings.taxEnabled);
    return { ok: true };
  } catch (err) {
    console.error('[HisabKit] settings save failed', err);
    return { ok: false, message: describeApiError(err, 'Settings could not be saved.') };
  }
}

/** One input for a setting, shaped by what the setting holds. */
function settingField(def, value) {
  const id = 'set_' + def.field;

  if (def.field === 'address') {
    return `<div class="field">
      <label for="${id}">${escapeHtml(def.label)}</label>
      <textarea class="textarea" id="${id}" name="${def.field}">${escapeHtml(value)}</textarea>
      ${def.hint ? `<span class="hint">${escapeHtml(def.hint)}</span>` : ''}
    </div>`;
  }

  if (def.field === 'taxEnabled' || def.field === 'lowStockAlert') {
    const on = cellBool(value);
    return `<div class="field">
      <label for="${id}">${escapeHtml(def.label)}</label>
      <select class="select" id="${id}" name="${def.field}">
        <option value="Yes" ${on ? 'selected' : ''}>Yes</option>
        <option value="No" ${!on ? 'selected' : ''}>No</option>
      </select>
      ${def.hint ? `<span class="hint">${escapeHtml(def.hint)}</span>` : ''}
    </div>`;
  }

  const type = def.field === 'defaultTaxRate' ? 'number' : 'text';
  const extra = def.field === 'currencySymbol' ? ' maxlength="3"' : '';
  return `<div class="field">
    <label for="${id}">${escapeHtml(def.label)}</label>
    <input class="input" id="${id}" name="${def.field}" type="${type}"${extra} value="${escapeHtml(value)}">
    ${def.hint ? `<span class="hint">${escapeHtml(def.hint)}</span>` : ''}
  </div>`;
}

function renderSettings() {

              </form>
            </div>
          </div>
        </div>

              <div class="kv-row"><span class="k">Suppliers</span><span class="v">${formatNumber(state.suppliers.length)}</span></div>

              <div class="kv-row"><span class="k">Stock ledger entries</span><span class="v">${formatNumber(state.ledger.length)}</span></div>
              <div class="kv-row"><span class="k">Payments</span><span class="v">${formatNumber(state.payments.length)}</span></div>
              <div class="kv-row"><span class="k">Storage used</span><span class="v">${formatNumber(storageUsedKB(), 1)} KB</span></div>
            </div>

          <div class="card">
            <div class="card-head"><h3>Google Sheets</h3></div>

      if (def.field === 'userName' && !value) value = 'Admin';
      if (def.field === 'gstin') value = value.toUpperCase();
      if (def.field === 'currencySymbol' && !value) value = '₹';
      values[def.field] = value;

    confirmDialog({
      title: 'Clear local cache',
      message: 'This removes the copy of your data held in this browser. Your Google Sheet is not touched — the app will read everything back from it.',
      confirmLabel: 'Clear Cache',
      danger: true,
      onConfirm() {
        Object.keys(STORAGE_KEYS).forEach(k => localStorage.removeItem(STORAGE_KEYS[k]));
        localStorage.removeItem(PENDING_KEY);
        init();
        showToast('Local cache cleared');
      }
    });
  });
}

function storageUsedKB() {
  let bytes = 0;
  Object.values(STORAGE_KEYS).forEach(k => {
    const v = localStorage.getItem(k);
    if (v) bytes += v.length * 2; // UTF-16 code units
  });
  return Math.round((bytes / 1024) * 10) / 10;
}

/* ============================================================
   9. NAVIGATION & EVENTS
   ============================================================ */

function navigate(route) {
  if (!ROUTE_META[route]) return;
  state.route = route;

  const group = groupOfRoute(route);
  if (group) openGroups.add(group);

  renderSidebar();
  renderTopbar();
  render();
  window.scrollTo(0, 0);
}

function render() {
  const r = state.route;
  switch (r) {
    case 'dashboard':        renderDashboard(); break;
    case 'inventory':        renderInventory(); break;
    case 'ledger':           renderLedger(); break;
    case 'lowstock':         renderLowStock(); break;
    case 'categories':       renderCategories(); break;
    case 'sales-invoices':   renderSales(); break;
    case 'purchase-bills':   renderPurchaseBills(); break;
    case 'customers':        renderParties('customer'); break;
    case 'suppliers':        renderParties('supplier'); break;
    case 'reports':          renderReports(); break;
    case 'payments':         renderPayments(); break;
    case 'cash-bank':        renderCashBank(); break;
    case 'settings':         renderSettings(); break;
    default:                 renderPlaceholder(r);
  }
}

function bindGlobalEvents() {
  // Sidebar navigation (delegated — the sidebar re-renders often)
  document.getElementById('sidebar').addEventListener('click', e => {
    const routeBtn = e.target.closest('[data-route]');
    if (routeBtn) { navigate(routeBtn.dataset.route); return; }

    const groupBtn = e.target.closest('[data-group]');
    if (groupBtn) {
      const key = groupBtn.dataset.group;
      if (openGroups.has(key)) openGroups.delete(key);
      else openGroups.add(key);
      renderSidebar();
    }
  });

  document.getElementById('topbar').addEventListener('click', e => {
    if (e.target.closest('#sidebarToggle')) {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      renderSidebar();
      document.getElementById('main').classList.toggle('collapsed', state.sidebarCollapsed);
      return;
    }
    if (e.target.closest('#notifBtn')) {
      const alerts = state.items.filter(i => calculateStockStatus(i) !== 'In Stock');
      navigate('lowstock');
      showToast(alerts.length ? `${alerts.length} item(s) need restocking` : 'No stock alerts right now', 'info');
      return;
    }
    if (e.target.closest('#bizSelector')) {
      showToast('Multiple businesses arrive in a later phase', 'info');
      return;
    }
    if (e.target.closest('#profileBtn')) { navigate('settings'); }
  });

  // Global search jumps to Inventory with the term applied
  document.getElementById('topbar').addEventListener('input', debounce(e => {
    if (e.target.id !== 'globalSearch') return;
    const term = e.target.value.trim();
    if (!term) return;
    state.inventory.search = term;
    state.inventory.page = 1;
    if (state.route !== 'inventory') navigate('inventory');
    else renderInventory();
  }, 350));

  // Sidebar responsive toggle on small screens
  document.getElementById('main').addEventListener('click', e => {
    const sb = document.getElementById('sidebar');
    if (window.innerWidth <= 900 && sb.classList.contains('mobile-open') && !e.target.closest('#sidebar')) {
      sb.classList.remove('mobile-open');
    }
  });

  // Escape closes modals and context menus
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.querySelector('.context-menu')) { closeContextMenu(); return; }
      if (activeModal) closeModal();
    }
  });

  document.addEventListener('click', () => closeContextMenu());
  window.addEventListener('resize', debounce(() => closeContextMenu(), 150));
}

/* ============================================================
   10. INITIALISATION
   ============================================================ */

async function init() {
  loadData();

  // Make sure every item's stock agrees with its ledger, and that the
  // ledger's running balances are internally consistent.
  recalculateAllBalances();

  // Honour the collapsed-sidebar preference on small screens
  if (window.innerWidth <= 900) state.sidebarCollapsed = true;

  // Paint immediately from the local cache so the app is never blank, then
  // read the Google Sheet, which is the source of truth.
  renderSidebar();
  renderTopbar();
  document.getElementById('main').classList.toggle('collapsed', state.sidebarCollapsed);
  render();
  bindGlobalEvents();

  const loaded = await loadFromApi();

  if (loaded) {
    clearSyncBanner();
    renderSidebar();
    renderTopbar();
    render();
    return;
  }

  // The sheet could not be reached. Show the last data we read from it, and
  // say so — nothing is invented to fill the gap.
  showSyncBanner(state.apiError + ' — showing the last data saved on this device.');
  renderTopbar();
  render();
  showToast(state.apiError, 'error');
}

// init() is async because it waits on the sheet; never let a rejection escape.
document.addEventListener('DOMContentLoaded', () => {
  init().catch(err => console.error('HisabKit: initialisation failed', err));
});
