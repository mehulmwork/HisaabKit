/** Settings rows (SettingKey / SettingValue) -> the app's settings object. */
function settingsFromRows(rows) {
  const out = Object.assign({}, DEFAULT_SETTINGS);
  (rows || []).forEach(row => {
    const key = cellText(row.SettingKey);
    const def = SETTING_DEFS.find(d => d.key.toLowerCase() === key.toLowerCase());
    if (!def) return;
    const value = cellText(row.SettingValue);
    out[def.field] = value === '' ? def.fallback : value;
  });
  out.lowStockAlert = cellBool(out.lowStockAlert);
  out.taxEnabled = cellBool(out.taxEnabled);
  return out;
}

/** settings object -> Settings rows, one per known key. */
function settingsToRows(settings) {
  return SETTING_DEFS.map(def => ({
    SettingID:   '',
    SettingKey:  def.key,
    SettingValue: String(settings[def.field] === undefined ? def.fallback : settings[def.field]),
    Description: def.label,
    Status:      'Active'
  }));
}

/** Dispatch table: sheet name -> readers, writers and the state array. */
const SHEET_MAP = {
  Items:          { stateKey: 'items',      fromRow: itemFromRow,   toRow: itemToRow },
  Categories:     { stateKey: 'categories', fromRow: categoryFromRow, toRow: categoryToRow },
  Customers:      { stateKey: 'customers',  fromRow: r => partyFromRow('customer', r), toRow: r => partyToRow('customer', r) },
  Suppliers:      { stateKey: 'suppliers',  fromRow: r => partyFromRow('supplier', r), toRow: r => partyToRow('supplier', r) },
  Purchases:      { stateKey: 'purchases',  fromRow: purchaseFromRow, toRow: purchaseToRow },
  Sales:          { stateKey: 'sales',      fromRow: saleFromRow,     toRow: saleToRow },
  Stock_Ledger:   { stateKey: 'ledger',     fromRow: ledgerFromRow,   toRow: ledgerToRow },
  Payments:       { stateKey: 'payments',   fromRow: paymentFromRow,  toRow: paymentToRow },
  // Document lines have no list of their own: they hang off their parent, so
  // they are collected from it when the next ID is worked out.
  Purchase_Items: { stateKey: null, listOf: () => state.purchases.reduce((all, p) => all.concat(p.items || []), []),
                    fromRow: r => lineFromRow('purchase', r), toRow: l => lineToRow('purchase', l) },
  Sales_Items:    { stateKey: null, listOf: () => state.sales.reduce((all, s) => all.concat(s.items || []), []),
                    fromRow: r => lineFromRow('sale', r),     toRow: l => lineToRow('sale', l) },
  Settings:       { stateKey: null, listOf: () => state.settingRows, fromRow: r => r, toRow: r => r }
};

/* ---- ID generation --------------------------------------------------
   The next ID continues the sheet's own sequence: the highest number used so
   far, plus one. ITM-001 and ITM-002 in the sheet give ITM-003, and an ID that
   does not follow the pattern (a legacy row) is ignored rather than counted.
   ------------------------------------------------------------------- */

/** Every record the app currently holds for a sheet, including document lines. */
function sheetRecords(sheetName) {
  const map = SHEET_MAP[sheetName];
  if (!map) return [];
  if (map.listOf) return map.listOf();
  return map.stateKey ? (state[map.stateKey] || []) : [];
}

/** The highest number already used for a sheet's prefix, or 0 if none is. */
function highestSuffix(sheetName) {
  const spec = SHEETS[sheetName];
  if (!spec) return 0;

  const pattern = new RegExp('^' + spec.prefix.replace('-', '\\-') + '(\\d+)$', 'i');
  let highest = 0;
  sheetRecords(sheetName).forEach(rec => {
    const match = pattern.exec(String(rec.id || '').trim());
    if (match) highest = Math.max(highest, parseInt(match[1], 10));
  });
  return highest;
}

function nextId(sheetName) {
  const spec = SHEETS[sheetName];
  if (!spec) return 'ID-' + Date.now().toString(36);
  return spec.prefix + String(highestSuffix(sheetName) + 1).padStart(3, '0');
}

/**
 * A run of consecutive IDs for a sheet, for the rows one save creates at once
 * (three document lines, two ledger entries). They are handed out from the
 * current highest number, so none of them collides with another.
 */
function nextIds(sheetName, count) {
  const spec = SHEETS[sheetName];
  if (!spec) return [];

  const start = highestSuffix(sheetName) + 1;
  const ids = [];
  for (let i = 0; i < count; i++) ids.push(spec.prefix + String(start + i).padStart(3, '0'));
  return ids;
}

/**
 * Next document number for a bill or invoice, using the prefix configured in
 * Settings and skipping numbers already used by another record.
 *
 * The numbers already in the sheet may carry a separator the setting does not
 * ("PB" in Settings, "PB-001" in the sheet), so the separator found on the
 * highest existing number is reused for the next one.
 */
function nextDocNumber(prefix, existing, field) {
  const escaped = String(prefix).replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
  const pattern = new RegExp('^' + escaped + '([-/_]?)(\\d+)$', 'i');
  let highest = 0;
  let separator = '';

  (existing || []).forEach(rec => {
    const match = pattern.exec(String(rec[field] || '').trim());
    if (!match) return;
    const number = parseInt(match[2], 10);
    if (number >= highest) { highest = number; separator = match[1] || ''; }
  });

  return prefix + separator + String(highest + 1).padStart(3, '0');
}

/* ---- applying sheet data to state ---- */

/**
 * Keep the app-only fields of records we already hold. The sheet has no column
 * for an item's brand, GST rate, supplier or description, so those are read
 * back from the local copy instead of being blanked on every reload.
 */
function mergeLocalExtras(incoming, localList, idField, preserved) {
  const byId = Object.create(null);
  (localList || []).forEach(rec => { byId[rec.id] = rec; });

  return incoming.map(rec => {
    const local = byId[rec.id];
    if (!local) return rec;
    const merged = Object.assign({}, rec);
    preserved.forEach(field => {
      const value = local[field];
      if (value !== undefined && value !== null && value !== '' && value !== 0) merged[field] = value;
    });
    if (local.createdAt) merged.createdAt = local.createdAt;
    return merged;
  });
}

/**
 * Reconcile the ledger with the stock the sheet reports.
 *
 * The sheet's CurrentStock is authoritative, and the ledger only records what
 * this app has done since. An item that arrived with 50 in stock and has since
 * been bought (+5) and sold (-3) has ledger rows totalling 2, while the sheet
 * still says 52. Without this, recalculateAllBalances() would trust the ledger
 * alone and rewrite the item's stock to 2.
 *
 * So for each item the difference between the sheet's CurrentStock and what the
 * ledger accounts for is bridged with a local entry:
 *
 *   sheet higher  an Opening Stock row, dated before the item's first movement,
 *                 because the stock was there before the app recorded anything;
 *   sheet lower   a Correction row, dated last, because stock the ledger counted
 *                 is no longer in the sheet — a stock take, or an edit made in
 *                 the spreadsheet.
 *
 * Both are local: they are never written to the sheet, and they are rebuilt on
 * every read, so this always follows whatever the sheet currently says.
 */
function ensureOpeningLedger() {
  const opening = [];
  const corrections = [];

  state.items.forEach(item => {
    const mine = state.ledger.filter(l => l.itemId === item.id);
    const net = round2(mine.reduce((total, row) => total + ledgerDelta(row), 0));
    const gap = round2(item.currentStock - net);
    if (gap === 0) return;

    const dates = mine.map(l => l.date).filter(Boolean).sort();

    if (gap > 0) {
      opening.push({
        id: 'LOCAL-OPENING-' + item.id,
        itemId: item.id,
        date: dates.length ? dates[0] : (item.createdAt || todayISO()),
        reference: 'OPENING',
        type: 'Opening Stock',
        quantityIn: gap,
        quantityOut: 0,
        balance: item.currentStock,
        unit: item.unit,
        reason: 'Opening stock carried in the sheet, not in the ledger',
        local: true
      });
    } else {
      corrections.push({
        id: 'LOCAL-CORRECTION-' + item.id,
        itemId: item.id,
        date: todayISO(),
        reference: 'SHEET',
        type: 'Correction',
        quantityIn: 0,
        quantityOut: round2(-gap),
        balance: item.currentStock,
        unit: item.unit,
        reason: 'Adjusts the ledger to the CurrentStock held in the spreadsheet',
        local: true
      });
    }
  });

  if (opening.length) state.ledger = opening.concat(state.ledger);
  if (corrections.length) state.ledger = state.ledger.concat(corrections);
}

/** Apply a full or partial set of sheet rows to state. */
function applySheetData(data) {
  const has = name => Object.prototype.hasOwnProperty.call(data, name);

  if (has('Categories')) {
    state.categories = (data.Categories || []).map(categoryFromRow)
      .filter(c => c.id || c.name);
  }

  if (has('Items')) {
    const incoming = (data.Items || []).map(itemFromRow).filter(i => i.id && i.name);
    state.items = mergeLocalExtras(incoming, state.items, 'ItemID',
      ['brand', 'gstRate', 'supplierId', 'description']);
  }

  if (has('Customers')) {
    state.customers = (data.Customers || []).map(r => partyFromRow('customer', r)).filter(p => p.name);
  }

  if (has('Suppliers')) {
    state.suppliers = (data.Suppliers || []).map(r => partyFromRow('supplier', r)).filter(p => p.name);
  }

  if (has('Purchases')) {
    state.purchases = (data.Purchases || []).map(purchaseFromRow).filter(p => p.id || p.billNumber);
  }
  if (has('Purchase_Items')) {
    const lines = (data.Purchase_Items || []).map(r => lineFromRow('purchase', r));
    state.purchases.forEach(p => { p.items = lines.filter(l => l.parentId === p.id); });
  }

  if (has('Sales')) {
    state.sales = (data.Sales || []).map(saleFromRow).filter(s => s.id || s.invoiceNumber);
  }
  if (has('Sales_Items')) {
    const lines = (data.Sales_Items || []).map(r => lineFromRow('sale', r));
    state.sales.forEach(s => { s.items = lines.filter(l => l.parentId === s.id); });
  }

  if (has('Stock_Ledger')) {
    state.ledger = (data.Stock_Ledger || []).map(ledgerFromRow).filter(l => l.id && l.itemId);
  }

  if (has('Payments')) {
    state.payments = (data.Payments || []).map(paymentFromRow).filter(p => p.id);
  }

  if (has('Settings')) {
    state.settingRows = (data.Settings || []).filter(r => cellText(r.SettingKey));
    state.settings = settingsFromRows(data.Settings || []);
  }

  ensureOpeningLedger();
  recalculateAllBalances();
  saveData();
}

/**
 * Startup read. One call returns every tab, so the app talks to Apps Script
 * once instead of eleven times.
 */
async function loadFromApi() {
  setBusy(true, 'Loading from Google Sheets…');
  try {
    await API.setup();                       // create any missing tab + headers
    const dump = await API.dump();
    applySheetData(dump);
    state.apiOnline = true;
    state.apiError = '';
    state.lastSync = new Date().toISOString();
    await flushPendingWrites();
    return true;
  } catch (err) {
    state.apiOnline = false;
    state.apiError = describeApiError(err, 'Could not load data from Google Sheets.');
    console.error('[HisabKit] startup load failed', err);
    return false;
  } finally {
    setBusy(false);
  }
}

/** Re-read one tab into state (used after a write, or by a Refresh button). */
async function refreshSheet(sheetName) {
  const rows = await API.list(sheetName);
  applySheetData({ [sheetName]: rows });
  return rows;
}

/**
 * Re-read every tab in one call, after a purchase, sale or payment has been
 * written. The screen then shows exactly what the sheet holds, rather than
 * what the app thinks it wrote.
 */
async function syncAll() {
  await flushPendingWrites();
  const dump = await API.dump();
  applySheetData(dump);
  state.lastSync = new Date().toISOString();
  return dump;
}

/* ---- write-through helpers ---- */

/**
 * Create a record in the sheet, then mirror it into state. A failure while
 * offline is queued for master data so the user's entry is never lost.
 */
async function repoCreate(sheetName, record) {
  const map = SHEET_MAP[sheetName];
  const saved = await API.create(sheetName, map.toRow(record));
  const local = map.fromRow(saved);

  if (map.stateKey) {
    state[map.stateKey].push(local);
    saveData([map.stateKey]);
  }
  return local;
}

async function repoUpdate(sheetName, id, fields) {
  const map = SHEET_MAP[sheetName];
  const spec = SHEETS[sheetName];
  const saved = await API.update(sheetName, spec.idField, id, map.toRow(Object.assign({ id: id }, fields)));
  const local = map.fromRow(saved);

  if (map.stateKey) {
    const list = state[map.stateKey];
    const index = list.findIndex(r => r.id === id);
    if (index !== -1) list[index] = Object.assign({}, list[index], local);
    saveData([map.stateKey]);
  }
  return local;
}

async function repoDelete(sheetName, id) {
  const map = SHEET_MAP[sheetName];
  const spec = SHEETS[sheetName];
  await API.remove(sheetName, spec.idField, id);
  if (map.stateKey) {
    state[map.stateKey] = state[map.stateKey].filter(r => r.id !== id);
    saveData([map.stateKey]);
  }
}

/** Several writes as one unit — a purchase, a sale or a payment. */
async function repoTransaction(ops) {
  const payload = ops.map(op => {
    const map = SHEET_MAP[op.sheet];
    if (op.action === 'delete') {
      return { action: 'delete', sheet: op.sheet, idField: SHEETS[op.sheet].idField, id: op.id };
    }
    return {
      action: op.action,
      sheet: op.sheet,
      idField: SHEETS[op.sheet].idField,
      id: op.id,
      data: map.toRow(Object.assign({}, op.data, { id: op.id || op.data.id }))
    };
  });

  return API.transaction(payload);
}

/* ---- offline queue for master data ----
   Only simple creates and updates are queued. A purchase or sale that fails
   is reported to the user instead, because replaying half of one later would
   be worse than not saving it.
   ---------------------------------------------------------------------- */

function readPending() {
  try {
    return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
  } catch (err) {
    return [];
  }
}

function writePending(list) {
  try {
    localStorage.setItem(PENDING_KEY, JSON.stringify(list));
  } catch (err) {
    console.error('HisabKit: could not store the offline queue', err);
  }
}

function queueWrite(entry) {
  const list = readPending();
  list.push(entry);
  writePending(list);
}

/** Push anything created or edited while the sheet was unreachable. */
async function flushPendingWrites() {
  const list = readPending();
  if (!list.length) return;

  console.log('[HisabKit API] pushing ' + list.length + ' change(s) saved while offline');
  const remaining = [];

  for (const entry of list) {
    try {
      if (entry.action === 'create') {
        await API.create(entry.sheet, entry.data);
      } else if (entry.action === 'update') {
        await API.update(entry.sheet, SHEETS[entry.sheet].idField, entry.id, entry.data);
      }
    } catch (err) {
      console.warn('[HisabKit API] still offline — ' + entry.sheet + ' change kept for later', err);
      remaining.push(entry);
    }
  }

  writePending(remaining);
  if (remaining.length !== list.length) {
    showToast((list.length - remaining.length) + ' offline change(s) synced to Google Sheets');
  }
}
/* ============================================================
   5. TOAST NOTIFICATIONS, BUSY INDICATOR, SYNC BANNER
   ============================================================ */
function showToast(message, type) {
  const root = document.getElementById('toastRoot');
  if (!root) return;
  const kind = type || 'success';
  const glyph = kind === 'error' ? ICONS.alert : kind === 'info' ? ICONS.info : ICONS.check;

  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `
    <span class="toast-ico">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${glyph}</svg>
    </span>
    <span>${escapeHtml(message)}</span>`;
  root.appendChild(el);

  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, 2600);
}

/**
 * Loading state for anything that waits on Google Sheets. Reference counted,
 * so nested calls (a save that re-reads) keep the indicator up until the last
 * one finishes.
 */
let busyDepth = 0;

function setBusy(on, message) {
  busyDepth = Math.max(0, busyDepth + (on ? 1 : -1));
  const bar = document.getElementById('syncBar');
  if (!bar) return;

  if (busyDepth > 0) {
    bar.classList.add('active');
    bar.querySelector('.sync-text').textContent = message || 'Working…';
  } else {
    bar.classList.remove('active');
  }
}

/**
 * Run an async action with a button disabled and relabelled, so a slow save
 * cannot be submitted twice.
 */
async function withBusyButton(button, busyLabel, fn) {
  const original = button ? button.innerHTML : null;
  if (button) {
    button.disabled = true;
    button.innerHTML = `<span class="spinner"></span> ${escapeHtml(busyLabel || 'Saving…')}`;
  }
  try {
    return await fn();
  } finally {
    if (button) {
      button.disabled = false;
      button.innerHTML = original;
    }
  }
}

/** A dismissible strip above the page, used when the sheet cannot be reached. */
function showSyncBanner(message) {
  const bar = document.getElementById('syncBar');
  if (!bar) return;
  bar.classList.add('offline');
  bar.querySelector('.sync-text').textContent = message;
}

function clearSyncBanner() {
  const bar = document.getElementById('syncBar');
  if (!bar) return;
  bar.classList.remove('offline');
  if (busyDepth === 0) bar.classList.remove('active');
}

/* ============================================================
   6. MODAL SYSTEM
   ============================================================ */
let activeModal = null;
let lastFocused = null;

/**
 * Open a modal.
 * opts: { title, body (html string), footer (html string), size, onMount(el), onSubmit }
 */
function openModal(opts) {
  closeModal();

  lastFocused = document.activeElement;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');

  const sizeCls = opts.size ? `modal-${opts.size}` : '';
  overlay.innerHTML = `
    <div class="modal ${sizeCls}" role="document">
      <div class="modal-head">
        <h3 id="modalTitle">${escapeHtml(opts.title || '')}</h3>
        <button class="modal-close" type="button" data-modal-close aria-label="Close dialog">
          ${icon('x', 17)}
        </button>
      </div>
      <div class="modal-body">${opts.body || ''}</div>
      ${opts.footer ? `<div class="modal-foot">${opts.footer}</div>` : ''}
    </div>`;

  document.getElementById('modalRoot').appendChild(overlay);
  activeModal = overlay;

  overlay.addEventListener('mousedown', e => {
    if (e.target === overlay) closeModal();
  });
  overlay.querySelectorAll('[data-modal-close]').forEach(btn => {
    btn.addEventListener('click', closeModal);
  });

  // Move focus into the dialog
  const focusTarget = overlay.querySelector(
    'input:not([type=hidden]), select, textarea, button:not([data-modal-close])'
  );
  if (focusTarget) focusTarget.focus();

  if (typeof opts.onMount === 'function') opts.onMount(overlay);
  return overlay;
}

function closeModal() {
  if (!activeModal) return;
  activeModal.remove();
  activeModal = null;
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
}

/** Confirmation dialog. Returns via callback so it stays promise-free. */
function confirmDialog(opts) {
  openModal({
    title: opts.title || 'Please confirm',
    size: '',
    body: `<p style="font-size:13.5px;line-height:1.6;">${opts.message}</p>`,
    footer: `
      <button class="btn btn-default" type="button" data-modal-close>Cancel</button>
      <button class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" type="button" id="confirmOk">
        ${escapeHtml(opts.confirmLabel || 'Confirm')}
      </button>`,
    onMount(el) {
      el.querySelector('#confirmOk').addEventListener('click', async () => {
        if (typeof opts.onConfirm !== 'function') { closeModal(); return; }

        const result = opts.onConfirm();

        // A confirm that writes to the sheet keeps the dialog up, with the
        // button disabled, until the write has finished.
        if (result && typeof result.then === 'function') {
          await withBusyButton(el.querySelector('#confirmOk'), opts.busyLabel || 'Working…', () => result);
          closeModal();
          return;
        }
        closeModal();
      });
    }
  });
}

/* ============================================================
   7. DOMAIN LOGIC
   ============================================================ */

/* ---- Lookups ---- */
const findItem      = id => state.items.find(i => i.id === id) || null;
const findSupplier  = id => state.suppliers.find(s => s.id === id) || null;
const findCustomer  = id => state.customers.find(c => c.id === id) || null;

const supplierName = id => { const s = findSupplier(id); return s ? s.name : '—'; };
const customerName = id => { const c = findCustomer(id); return c ? c.name : '—'; };
const itemName     = id => { const i = findItem(id); return i ? i.name : '—'; };

/* ---- Stock calculations ---- */
function calculateStockStatus(item) {
  if (!item) return 'Out of Stock';
  if (item.currentStock <= 0) return 'Out of Stock';
  if (item.currentStock <= item.lowStockLevel) return 'Low Stock';
  return 'In Stock';
}

function stockStatusClass(status) {
  if (status === 'In Stock') return 'badge-instock';
  if (status === 'Low Stock') return 'badge-lowstock';
  return 'badge-outstock';
}

/** Stock value at purchase cost (what the inventory is worth on the books). */
function itemStockValue(item) {
  return round2((item.currentStock || 0) * (item.purchasePrice || 0));
}

function calculateInventoryValue() {
  return round2(sum(state.items, itemStockValue));
}

/** Headline numbers for the Inventory summary cards and the dashboard. */
function getStockStats() {
  let low = 0, out = 0;
  state.items.forEach(it => {
    const s = calculateStockStatus(it);
    if (s === 'Low Stock') low++;
    else if (s === 'Out of Stock') out++;
  });
  return {
    totalItems: state.items.length,
    totalValue: calculateInventoryValue(),
    lowStock: low,
    outOfStock: out,
    inStock: state.items.length - low - out
  };
}

/* ---- Ledger ---- */
function sortLedger() {
  // Stable sort by date only — preserves the seeded order within a day
  // and appends newly-entered same-day rows after existing ones.
  state.ledger.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

/** Walk one item's ledger in order, rewriting each row's running balance
    and syncing the item's currentStock to the final figure. */
function applyLedgerBalance(itemId) {
  const item = findItem(itemId);
  if (!item) return;
  let bal = 0;
  state.ledger.filter(l => l.itemId === itemId).forEach(row => {
    bal += ledgerDelta(row);
    row.balance = bal;
  });
  item.currentStock = bal;
}

function recalculateAllBalances() {
  sortLedger();
  state.items.forEach(it => applyLedgerBalance(it.id));
}

/**
 * A Stock_Ledger row expressed as a transaction operation, for the writes that
 * must land together with an item's stock change.
 */
function ledgerOp(spec) {
  const item = findItem(spec.itemId);
  return {
    action: 'create',
    sheet: 'Stock_Ledger',
    id: spec.id || nextId('Stock_Ledger'),
    data: {
      itemId: spec.itemId,
      date: spec.date || todayISO(),
      reference: spec.reference || '—',
      type: spec.type || 'Adjustment',
      quantityIn: round2(spec.quantityIn || 0),
      quantityOut: round2(spec.quantityOut || 0),
      balance: round2(spec.balance || 0),
      unit: spec.unit || (item ? item.unit : ''),
      reason: spec.reason || ''
    }
  };
}

/** Write one Stock_Ledger row on its own, then mirror it into state. */
async function writeLedgerEntry(spec) {
  const op = ledgerOp(spec);
  const saved = await API.create('Stock_Ledger', ledgerToRow(Object.assign({ id: op.id }, op.data)));
  const entry = ledgerFromRow(saved);
  state.ledger.push(entry);
  sortLedger();

  const item = findItem(entry.itemId);
  if (item) {
    item.updatedAt = entry.date;
    applyLedgerBalance(item.id);
  }
  saveData(['ledger', 'items']);
  return entry;
}

/* ---- Items ---- */
function isSkuTaken(sku, excludeId) {
  if (!sku) return false;
  const needle = String(sku).trim().toLowerCase();
  return state.items.some(i =>
    i.sku && i.sku.toLowerCase() === needle && i.id !== excludeId
  );
}

/**
 * Add an item: one row in the Items sheet, plus an opening Stock_Ledger row
 * when it starts with stock. The item is only added to the screen after the
 * sheet has accepted it; if the sheet cannot be reached the change is queued
 * and pushed on the next successful load.
 */
async function createItem(fields) {
  const now = todayISO();
  const record = {
    id: nextId('Items'),
    sku: fields.sku || '',
    name: fields.name,
    category: fields.category || '',
    brand: fields.brand || '',
    unit: fields.unit,
    purchasePrice: round2(fields.purchasePrice),
    sellingPrice: round2(fields.sellingPrice),
    gstRate: Number(fields.gstRate) || 0,
    currentStock: round2(fields.openingStock) || 0,
    openingStock: round2(fields.openingStock) || 0,
    lowStockLevel: round2(fields.lowStockLevel) || 0,
    supplierId: fields.supplierId || '',
    description: fields.description || '',
    sheetStatus: 'Active',
    createdAt: now,
    updatedAt: now
  };

  try {
    const saved = await API.create('Items', itemToRow(record));
    // The sheet has no columns for the four extras, so carry them over here.
    const item = Object.assign(itemFromRow(saved), {
      brand: record.brand,
      gstRate: record.gstRate,
      supplierId: record.supplierId,
      description: record.description,
      createdAt: record.createdAt
    });
    state.items.push(item);
    saveData(['items']);

    if (item.currentStock > 0) {
      await writeLedgerEntry({
        itemId: item.id,
        date: now,
        reference: 'OPENING',
        type: 'Opening Stock',
        quantityIn: item.currentStock,
        quantityOut: 0,
        unit: item.unit,
        balance: item.currentStock,
        reason: 'Opening stock'
      });
    }
    return item;
  } catch (err) {
    console.error('[HisabKit] create item failed', err);
    // Keep the entry on this device and push it up when the sheet is back.
    const item = Object.assign({}, record, { pendingSync: true });
    state.items.push(item);
    saveData(['items']);
    queueWrite({ action: 'create', sheet: 'Items', data: itemToRow(item) });
    throw err;
  }
}

/** Edit an item. A changed opening stock is recorded as a stock correction. */
async function updateItem(id, fields) {
  const item = findItem(id);
  if (!item) return null;

  const stockDelta = round2((Number(fields.openingStock) || 0) - (Number(item.openingStock) || 0));
  const next = Object.assign({}, item, {
    sku: fields.sku || '',
    name: fields.name,
    category: fields.category || '',
    brand: fields.brand || '',
    unit: fields.unit,
    purchasePrice: round2(fields.purchasePrice),
    sellingPrice: round2(fields.sellingPrice),
    gstRate: Number(fields.gstRate) || 0,
    lowStockLevel: round2(fields.lowStockLevel) || 0,
    supplierId: fields.supplierId || '',
    description: fields.description || '',
    updatedAt: todayISO()
  });
  if (stockDelta !== 0) next.currentStock = round2(item.currentStock + stockDelta);
  next.openingStock = round2(fields.openingStock) || 0;

  const ops = [{
    action: 'update', sheet: 'Items', id: id, data: next
  }];

  if (stockDelta !== 0) {
    ops.push(ledgerOp({
      itemId: id,
      date: todayISO(),
      reference: 'EDIT',
      type: 'Correction',
      quantityIn: stockDelta > 0 ? stockDelta : 0,
      quantityOut: stockDelta < 0 ? -stockDelta : 0,
      unit: item.unit,
      balance: next.currentStock,
      reason: 'Opening stock edited'
    }));
  }

  await repoTransaction(ops);

  Object.assign(item, next);
  saveData(['items']);

  if (stockDelta !== 0) {
    await refreshSheet('Stock_Ledger');
  }
  return item;
}

/**
 * Delete an item — unless transactions depend on it. An item that appears in a
 * purchase or sale is history and must stay; the user is pointed at Inactive
 * status instead. The item's own ledger rows go with it.
 */
async function deleteItem(id) {
  const item = findItem(id);
  if (!item) return;

  const guard = itemDeleteGuard(id);
  if (guard.blocked) {
    showToast(guard.message, 'error');
    return false;
  }

  const ledgerIds = state.ledger.filter(l => l.itemId === id && !l.local).map(l => l.id);
  const ops = ledgerIds.map(lid => ({ action: 'delete', sheet: 'Stock_Ledger', id: lid }));
  ops.push({ action: 'delete', sheet: 'Items', id: id });

  await repoTransaction(ops);

  state.items = state.items.filter(i => i.id !== id);
  state.ledger = state.ledger.filter(l => l.itemId !== id);
  state.inventory.selected.delete(id);
  saveData(['items', 'ledger']);
  return true;
}

/** Why an item cannot be deleted, if it cannot. */
function itemDeleteGuard(id) {
  const lineUses = state.purchases.reduce((n, p) =>
    n + (p.items || []).filter(l => l.itemId === id).length, 0);
  const saleUses = state.sales.reduce((n, s) =>
    n + (s.items || []).filter(l => l.itemId === id).length, 0);
  const total = lineUses + saleUses;

  if (!total) return { blocked: false };

  const parts = [];
  if (lineUses) parts.push(lineUses + ' purchase line' + (lineUses === 1 ? '' : 's'));
  if (saleUses) parts.push(saleUses + ' sales line' + (saleUses === 1 ? '' : 's'));

  return {
    blocked: true,
    message: 'This item is used by ' + parts.join(' and ') +
             '. Mark it Inactive instead of deleting it.'
  };
}

/* ---- Stock adjustment ---- */
/**
 * type: 'Stock In' | 'Stock Out' | 'Damage' | 'Correction'
 * For Correction, `quantity` is the corrected on-hand figure.
 */
async function adjustStock(spec) {
  const item = findItem(spec.itemId);
  if (!item) return { ok: false, message: 'Item not found' };

  const qty = round2(spec.quantity);
  const ledgerType = spec.type === 'Stock In' || spec.type === 'Stock Out'
    ? 'Adjustment'
    : spec.type; // 'Damage' | 'Correction'

  let qIn = 0, qOut = 0;

  if (spec.type === 'Stock In') {
    if (qty <= 0) return { ok: false, message: 'Quantity must be greater than zero' };
    qIn = qty;
  } else if (spec.type === 'Stock Out' || spec.type === 'Damage') {
    if (qty <= 0) return { ok: false, message: 'Quantity must be greater than zero' };
    if (qty > item.currentStock) {
      return { ok: false, message: `Only ${formatNumber(item.currentStock)} ${item.unit} in stock` };
    }
    qOut = qty;
  } else if (spec.type === 'Correction') {
    if (qty < 0) return { ok: false, message: 'Corrected quantity cannot be negative' };
    const delta = round2(qty - item.currentStock);
    if (delta > 0) qIn = delta;
    else if (delta < 0) qOut = -delta;
  } else {
    return { ok: false, message: 'Unknown adjustment type' };
  }

  const newStock = round2(item.currentStock + qIn - qOut);

  try {
    await repoTransaction([
      { action: 'update', sheet: 'Items', id: item.id,
        data: Object.assign({}, item, { currentStock: newStock, updatedAt: todayISO() }) },
      ledgerOp({
        itemId: item.id,
        date: spec.date || todayISO(),
        reference: spec.reference || 'ADJ',
        type: ledgerType,
        quantityIn: qIn,
        quantityOut: qOut,
        unit: item.unit,
        balance: newStock,
        reason: spec.reason || spec.type
      })
    ]);
  } catch (err) {
    console.error('[HisabKit] stock adjustment failed', err);
    return { ok: false, message: describeApiError(err, 'The adjustment could not be saved.') };
  }

  item.currentStock = newStock;
  item.updatedAt = todayISO();
  await refreshSheet('Stock_Ledger');
  saveData(['items', 'ledger']);
  return { ok: true };
}

/* ---- Purchases ---- */
function getPurchaseStats(purchases) {
  const list = purchases || state.purchases;
  const total = round2(sum(list, p => p.total));
  const paid = round2(sum(list, p => p.paid));
  return { total, paid, unpaid: round2(total - paid) };
}

function purchaseStatus(p) {
  if (p.balance <= 0) return 'Paid';
  if (p.paid > 0) return 'Partially Paid';
  return 'Unpaid';
}

/** The Payments module's PaymentMode, derived from the form's payment type. */
function paymentModeFrom(paymentType) {
  const map = { Cash: 'Cash', Bank: 'Bank Transfer', UPI: 'UPI', Credit: 'Credit', Card: 'Card', Cheque: 'Cheque' };
  return map[paymentType] || 'Cash';
}

/**
 * A Payments row for a bill or invoice settled in full or in part.
 * kind: 'purchase' (money paid out) | 'sale' (money received).
 */
function settlementOp(kind, doc, referenceField) {
  return {
    action: 'create',
    sheet: 'Payments',
    id: nextId('Payments'),
    data: {
      date: doc.date,
      partyType: kind === 'purchase' ? 'Supplier' : 'Customer',
      partyId: kind === 'purchase' ? doc.supplierId : doc.customerId,
      referenceType: kind === 'purchase' ? 'Purchase' : 'Sale',
      referenceId: doc.id,
      amount: round2(doc.paid),
      paymentMode: paymentModeFrom(doc.paymentType),
      transactionType: kind === 'purchase' ? 'Paid' : 'Received',
      notes: 'Against ' + (doc[referenceField] || doc.id)
    }
  };
}

/**
 * Persist a purchase bill and everything that hangs off it as one write: the
 * Purchases row, one Purchase_Items row per line, the stock increase on each
 * item, a Stock_Ledger row per line, and a Payments row when part of the bill
 * was paid.
 *
 * Apps Script applies the whole batch or none of it, so a failure part way
 * through leaves the sheet exactly as it was — the bill header can never be
 * saved without its lines.
 *
 * form: { supplierId, billNumber, date, items[], subtotal, discount, tax,
 *         roundOff, total, paid, paymentType, notes }
 * Returns { ok, message, purchase }.
 */
async function savePurchase(form) {
  const lines = (form.items || []).filter(li => li.itemId && li.quantity > 0);
  if (!lines.length) return { ok: false, message: 'Add at least one item with a quantity.' };
  if (!form.supplierId) return { ok: false, message: 'Please select a supplier.' };

  for (const li of lines) {
    if (!findItem(li.itemId)) return { ok: false, message: 'An item on this bill is no longer in your inventory.' };
  }

  const paid = round2(form.paid || 0);
  const purchase = {
    id: nextId('Purchases'),
    supplierId: form.supplierId,
    billNumber: form.billNumber,
    date: form.date || todayISO(),
    subTotal: round2(form.subtotal),
    discount: round2(form.discount || 0),
    taxAmount: round2(form.tax),
    total: round2(form.total),
    paid: paid,
    balance: round2(form.total - paid),
    paymentStatus: '',
    notes: form.notes || '',
    paymentType: form.paymentType || 'Cash',
    items: []
  };
  purchase.paymentStatus = purchaseStatus(purchase);

  const lineIds = nextIds('Purchase_Items', lines.length);
  const ledgerIds = nextIds('Stock_Ledger', lines.length);
  const ops = [{ action: 'create', sheet: 'Purchases', id: purchase.id, data: purchase }];

  lines.forEach((li, i) => {
    const item = findItem(li.itemId);
    const newStock = round2(item.currentStock + li.quantity);

    const line = {
      id: lineIds[i], parentId: purchase.id, itemId: li.itemId, quantity: round2(li.quantity),
      unit: li.unit || item.unit, price: round2(li.price), discount: round2(li.discount || 0),
      taxRate: round2(li.gstRate), taxAmount: round2(li.taxAmount), total: round2(li.amount),
      name: item.name
    };
    purchase.items.push(line);
    ops.push({ action: 'create', sheet: 'Purchase_Items', id: line.id, data: line });

    ops.push({
      action: 'update', sheet: 'Items', id: item.id,
      data: Object.assign({}, item, { currentStock: newStock })
    });
    ops.push(ledgerOp({
      id: ledgerIds[i], itemId: item.id, date: purchase.date, reference: purchase.billNumber,
      type: 'Purchase', quantityIn: li.quantity, quantityOut: 0, balance: newStock,
      unit: li.unit || item.unit, reason: 'Purchase bill ' + purchase.billNumber
    }));
  });

  if (paid > 0) ops.push(settlementOp('purchase', purchase, 'billNumber'));

  try {
    await repoTransaction(ops);
    await syncAll();
    return { ok: true, purchase };
  } catch (err) {
    console.error('[HisabKit] purchase save failed', err);
    return { ok: false, message: describeApiError(err, 'Purchase could not be saved.') };
  }
}

/* ---- Sales ---- */
function getSalesStats(sales) {
  const list = sales || state.sales;
  const total = round2(sum(list, s => s.total));
  const received = round2(sum(list, s => s.paid));
  return { total, received, receivable: round2(total - received) };
}

/**
 * Persist a sales invoice and everything that hangs off it as one write: the
 * Sales row, one Sales_Items row per line, the stock reduction on each item, a
 * Stock_Ledger row per line, and a Payments row when part of the invoice was
 * received.
 *
 * Stock is checked line by line before anything is written, and the batch is
 * all-or-nothing, so an invoice can never take stock below zero.
 *
 * Returns { ok, message, sale }.
 */
async function saveSale(form) {
  const lines = (form.items || []).filter(li => li.itemId && li.quantity > 0);
  if (!lines.length) return { ok: false, message: 'Add at least one item with a quantity.' };
  if (!form.customerId) return { ok: false, message: 'Please select a customer.' };

  // Validate every line first, so nothing is written when one of them fails.
  const stockNeeded = {};
  for (const li of lines) {
    const item = findItem(li.itemId);
    if (!item) return { ok: false, message: 'An item on this invoice is no longer in your inventory.' };
    stockNeeded[item.id] = round2((stockNeeded[item.id] || 0) + li.quantity);
    if (stockNeeded[item.id] > item.currentStock) {
      return {
        ok: false,
        message: `Insufficient stock for ${item.name} — only ${formatNumber(item.currentStock)} ${item.unit} available.`
      };
    }
  }

  const paid = round2(form.paid || 0);
  const sale = {
    id: nextId('Sales'),
    customerId: form.customerId,
    invoiceNumber: form.invoiceNumber,
    date: form.date || todayISO(),
    subTotal: round2(form.subtotal),
    discount: round2(form.discount || 0),
    taxAmount: round2(form.tax),
    total: round2(form.total),
    paid: paid,
    balance: round2(form.total - paid),
    paymentStatus: '',
    notes: form.notes || '',
    paymentType: form.paymentType || 'Cash',
    items: []
  };
  sale.paymentStatus = purchaseStatus(sale);

  const lineIds = nextIds('Sales_Items', lines.length);
  const ledgerIds = nextIds('Stock_Ledger', lines.length);
  const ops = [{ action: 'create', sheet: 'Sales', id: sale.id, data: sale }];

  lines.forEach((li, i) => {
    const item = findItem(li.itemId);
    const newStock = round2(item.currentStock - li.quantity);

    const line = {
      id: lineIds[i], parentId: sale.id, itemId: li.itemId, quantity: round2(li.quantity),
      unit: li.unit || item.unit, price: round2(li.price), discount: round2(li.discount || 0),
      taxRate: round2(li.gstRate), taxAmount: round2(li.taxAmount), total: round2(li.amount),
      name: item.name
    };
    sale.items.push(line);
    ops.push({ action: 'create', sheet: 'Sales_Items', id: line.id, data: line });

    ops.push({
      action: 'update', sheet: 'Items', id: item.id,
      data: Object.assign({}, item, { currentStock: newStock })
    });
    ops.push(ledgerOp({
      id: ledgerIds[i], itemId: item.id, date: sale.date, reference: sale.invoiceNumber,
      type: 'Sale', quantityIn: 0, quantityOut: li.quantity, balance: newStock,
      unit: li.unit || item.unit, reason: 'Sales invoice ' + sale.invoiceNumber
    }));
  });

  if (paid > 0) ops.push(settlementOp('sale', sale, 'invoiceNumber'));

  try {
    await repoTransaction(ops);
    await syncAll();
    return { ok: true, sale };
  } catch (err) {
    console.error('[HisabKit] sale save failed', err);
    return { ok: false, message: describeApiError(err, 'Invoice could not be saved.') };
  }
}

/**
 * Record money received against an invoice, or paid against a bill.
 *
 * The Payments row and the document's PaidAmount, DueAmount and PaymentStatus
 * are written as one batch, so the payments list and the bill can never
 * disagree about how much is still owed.
 *
 * Returns { ok, message }.
 */
async function recordSettlement(kind, docId, amount, paymentMode, date) {
  const buying = kind === 'purchase';
  const list = buying ? state.purchases : state.sales;
  const doc = list.find(d => d.id === docId);
  if (!doc) return { ok: false, message: 'That document is no longer loaded. Reload the page and try again.' };

  const amt = round2(amount);
  if (!(amt > 0)) return { ok: false, message: 'Enter an amount greater than zero.' };
  if (amt > round2(doc.balance)) {
    return { ok: false, message: 'The amount cannot be more than the balance due of ' + formatCurrency(doc.balance) + '.' };
  }

  const paid = round2(doc.paid + amt);
  const updated = Object.assign({}, doc, { paid: paid, balance: round2(doc.total - paid) });
  updated.paymentStatus = purchaseStatus(updated);

  const ops = [
    { action: 'update', sheet: buying ? 'Purchases' : 'Sales', id: doc.id, data: updated },
    { action: 'create', sheet: 'Payments', id: nextId('Payments'), data: {
        date: date || todayISO(),
        partyType: buying ? 'Supplier' : 'Customer',
        partyId: buying ? doc.supplierId : doc.customerId,
        referenceType: buying ? 'Purchase' : 'Sale',
        referenceId: doc.id,
        amount: amt,
        paymentMode: paymentMode || 'Cash',
        transactionType: buying ? 'Paid' : 'Received',
        notes: 'Against ' + (buying ? doc.billNumber : doc.invoiceNumber)
    } }
  ];

  try {
    await repoTransaction(ops);
    await syncAll();
    return { ok: true };
  } catch (err) {
    console.error('[HisabKit] settlement failed', err);
    return { ok: false, message: describeApiError(err, 'The payment could not be recorded.') };
  }
}

/* ---- Dashboard roll-ups ---- */
function getDashboardStats() {
  const today = todayISO();
  const monthStart = startOfMonthISO();

  const todaySales = sum(state.sales.filter(s => s.date === today), s => s.total);
  const todayPurchases = sum(state.purchases.filter(p => p.date === today), p => p.total);
  const monthSales = sum(state.sales.filter(s => s.date >= monthStart), s => s.total);

  const receivables = round2(sum(state.sales.filter(s => s.balance > 0), s => s.balance));
  const payables = round2(sum(state.purchases.filter(p => p.balance > 0), p => p.balance));

  return {
    todaySales, todayPurchases, monthSales,
    inventoryValue: calculateInventoryValue(),
    receivables, payables,
    totalSales: round2(sum(state.sales, s => s.total)),
    totalPurchases: round2(sum(state.purchases, p => p.total)),
    customerCount: state.customers.length,
    supplierCount: state.suppliers.length,
    stock: getStockStats()
  };
}

/** Aggregate quantity moved per item, for "Top Moving Items". */
function getTopMovingItems(limit) {
  const moved = {};
  state.ledger.forEach(l => {
    if (l.type === 'Sale') {
      moved[l.itemId] = (moved[l.itemId] || 0) + (Number(l.quantityOut) || 0);
    }
  });
  return Object.keys(moved)
    .map(itemId => ({ item: findItem(itemId), qty: moved[itemId] }))
    .filter(x => x.item)
    .sort((a, b) => b.qty - a.qty)
    .slice(0, limit || 5);
}

/** Category choices come from the Categories sheet; items are only a fallback. */
function categoryOptions(selected, includeAll) {
  const fromSheet = state.categories
    .filter(c => (c.status || 'Active').toLowerCase() !== 'inactive')
    .map(c => c.name)
    .filter(Boolean);

  const usedByItems = state.items.map(i => i.category).filter(Boolean);
  const all = Array.from(new Set(fromSheet.concat(usedByItems))).sort();

  return (includeAll ? `<option value="">All Categories</option>` : '') +
    all.map(c => `<option value="${escapeHtml(c)}" ${selected === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');

function emptyRow(colspan, title, msg) {

    </div></td></tr>`;

function closeContextMenu() {
  document.querySelectorAll('.context-menu').forEach(m => m.remove());
}

/** Floating row-action menu anchored to a button. */
function openContextMenu(anchor, actions) {
  closeContextMenu();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = actions.map((a, i) => a === '---'
    ? '<div class="sep"></div>'
    : `<button type="button" data-idx="${i}" class="${a.danger ? 'danger' : ''}" role="menuitem">
         ${icon(a.icon, 14)}<span>${escapeHtml(a.label)}</span>
       </button>`).join('');

  document.body.appendChild(menu);

  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = r.right - mw;
  let top = r.bottom + 5;
  if (left < 8) left = 8;
  if (top + mh > window.innerHeight - 8) top = r.top - mh - 5;
  menu.style.left = `${left}px`;
  menu.style.top = `${Math.max(8, top)}px`;

  menu.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const action = actions[Number(btn.dataset.idx)];
      closeContextMenu();
      if (action && typeof action.onClick === 'function') action.onClick();
    });
  });
}

function paymentBadge(status) {
  const cls = status === 'Paid' ? 'badge-paid'
    : status === 'Partially Paid' ? 'badge-partial' : 'badge-unpaid';
  return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
}

/* ---- CSV / print helpers ---- */
function exportCSV(filename, headers, rows) {
  const esc = v => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [headers.map(esc).join(',')]
    .concat(rows.map(r => r.map(esc).join(',')))
    .join('\r\n');

  // BOM so Excel reads the ₹ and non-ASCII characters correctly
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export downloaded');
}

const INVENTORY_COLUMNS = [
  { key:'sku',           label:'SKU',             sortable:true },
  { key:'name',          label:'Item Name',       sortable:true },
  { key:'category',      label:'Category',        sortable:true },
  { key:'unit',          label:'Unit',            sortable:false },
  { key:'purchasePrice', label:'Purchase Price',  sortable:true, num:true },
  { key:'sellingPrice',  label:'Selling Price',   sortable:true, num:true },
  { key:'currentStock',  label:'Current Stock',   sortable:true, num:true },
  { key:'lowStockLevel', label:'Low Stock Level', sortable:true, num:true },
  { key:'stockValue',    label:'Stock Value',     sortable:true, num:true },
  { key:'updatedAt',     label:'Last Updated',    sortable:true },
  { key:'status',        label:'Status',          sortable:true },
  { key:'actions',       label:'Actions',         sortable:false }
];

function getFilteredItems() {
  const f = state.inventory;
  const needle = f.search.trim().toLowerCase();

  let list = state.items.filter(it => {
    if (needle) {
      const hay = [it.name, it.sku, it.brand, it.category]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(needle)) return false;
    }
    if (f.category && it.category !== f.category) return false;
    if (f.supplier && it.supplierId !== f.supplier) return false;
    if (f.stockStatus && calculateStockStatus(it) !== f.stockStatus) return false;
    return true;
  });

  const dir = f.sortDir === 'asc' ? 1 : -1;
  const k = f.sortKey;

  list.sort((a, b) => {
    let av, bv;
    if (k === 'stockValue') { av = itemStockValue(a); bv = itemStockValue(b); }
    else if (k === 'status') { av = calculateStockStatus(a); bv = calculateStockStatus(b); }
    else { av = a[k]; bv = b[k]; }

    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
    return String(av === undefined || av === null ? '' : av)
      .localeCompare(String(bv === undefined || bv === null ? '' : bv), undefined, { numeric:true }) * dir;
  });

  return list;
}

function renderInventory() {
  const stats = getStockStats();
  const f = state.inventory;
  const filtered = getFilteredItems();

  const totalPages = Math.max(1, Math.ceil(filtered.length / f.pageSize));

    if (col.key === 'actions') return `<th class="td-actions">${col.label}</th>`;

      <span class="th-in">${col.label}<span class="sort-caret">${f.sortKey === col.key ? (f.sortDir === 'asc' ? '▲' : '▼') : '▲'}</span></span>
    </th>`;

    return `
      <tr data-id="${it.id}" class="${checked ? 'selected' : ''}">
        <td class="col-check">

                 aria-label="Select ${escapeHtml(it.name)}" ${checked ? 'checked' : ''}>
        </td>
        <td class="mono td-sub">${escapeHtml(it.sku || '—')}</td>
        <td>
          <div class="td-strong">${escapeHtml(it.name)}</div>
          ${it.brand ? `<div class="td-sub">${escapeHtml(it.brand)}</div>` : ''}
        </td>
        <td>${escapeHtml(it.category || '—')}</td>

        <td class="num">${formatCurrency(it.sellingPrice)}</td>

        <td class="num">${formatNumber(it.lowStockLevel)}</td>
        <td class="num td-strong">${formatCurrency(itemStockValue(it))}</td>
        <td class="td-sub">${formatDate(it.updatedAt)}</td>

        <td class="td-actions">
          <button class="row-menu-btn" data-rowmenu="${it.id}"

          </button>
        </td>
      </tr>`;
  }).join('') : emptyRow(INVENTORY_COLUMNS.length + 1, 'No items found',
      state.items.length ? 'Try adjusting your search or filters.' : 'Add your first item to get started.');

  const pageBtns = buildPager(f.page, totalPages);

  document.getElementById('view').innerHTML = `
    <div class="view-inner">
      <div class="page-head">
        <div>
          <h2>Inventory</h2>

        </div>
        <div class="page-head-actions">
          <button class="btn btn-default" id="btnAdjustStock">${icon('adjust', 15)} Stock Adjustment</button>
          <button class="btn btn-primary" id="btnAddItem">${icon('plus', 15)} Add Item</button>
        </div>
      </div>

      <div class="stat-grid">
        ${statCard({ tone:'blue',  icon:'box',    label:'Total Items',       value:formatNumber(stats.totalItems), sub:'Items in catalog' })}
        ${statCard({ tone:'green', icon:'wallet', label:'Total Stock Value', value:formatCurrency(stats.totalValue), sub:'Current inventory value' })}
        ${statCard({ tone:'amber', icon:'alert',  label:'Low Stock',         value:formatNumber(stats.lowStock), sub:'Items need attention' })}
        ${statCard({ tone:'red',   icon:'x',      label:'Out of Stock',      value:formatNumber(stats.outOfStock), sub:'Items unavailable' })}

      <div class="filter-bar no-print">

                   value="${escapeHtml(f.search)}" autocomplete="off">
          </div>
        </div>
        <div class="filter-group">
          <label for="fCategory">Category</label>
          <select class="select w-170" id="fCategory">${categoryOptions(f.category, true)}</select>
        </div>

          <label for="fStock">Stock Status</label>
          <select class="select w-140" id="fStock">

            ${['In Stock','Low Stock','Out of Stock'].map(s =>
              `<option value="${s}" ${f.stockStatus === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label for="fSupplier">Supplier</label>
          <select class="select w-170" id="fSupplier">${supplierOptions(f.supplier, true)}</select>

          <span class="foot-info">
            ${filtered.length
              ? `Showing <strong>${start + 1}–${Math.min(start + f.pageSize, filtered.length)}</strong> of <strong>${filtered.length}</strong> items`
              : 'No items to show'}
            ${f.selected.size ? ` · <strong>${f.selected.size}</strong> selected` : ''}
          </span>
          <div class="foot-mid">
            ${f.selected.size ? `<button class="btn btn-danger btn-sm" id="btnBulkDelete">${icon('trash', 13)} Delete Selected</button>` : ''}
            <label class="sr-only" for="pageSize">Items per page</label>
            <select class="select page-size" id="pageSize">
              ${[10,25,50].map(n => `<option value="${n}" ${f.pageSize === n ? 'selected' : ''}>${n} / page</option>`).join('')}
            </select>
          </div>
          <div class="pager">${pageBtns}</div>

  bindInventoryEvents();

function buildPager(current, total) {
  if (total <= 1) return '';
  const btn = (label, page, opts) => {
    const o = opts || {};
    return `<button class="page-btn ${o.active ? 'active' : ''}" data-page="${page}"
      ${o.disabled ? 'disabled' : ''} aria-label="${escapeHtml(o.aria || String(label))}"
      ${o.active ? 'aria-current="page"' : ''}>${label}</button>`;
  };

  let html = btn(icon('chevronLeft', 14), current - 1, { disabled: current === 1, aria:'Previous page' });

  const pages = [];
  for (let p = 1; p <= total; p++) {
    if (p === 1 || p === total || Math.abs(p - current) <= 1) pages.push(p);
    else if (pages[pages.length - 1] !== '…') pages.push('…');
  }
  pages.forEach(p => {
    html += p === '…'
      ? `<span style="padding:0 4px;color:var(--text-muted);">…</span>`
      : btn(p, p, { active: p === current });
  });

  html += btn(icon('chevronRight', 14), current + 1, { disabled: current === total, aria:'Next page' });
  return html;
}

function bindInventoryEvents() {
  const view = document.getElementById('view');

  // Search (debounced so we don't re-render on every keystroke)
  const search = view.querySelector('#fSearch');
  search.addEventListener('input', debounce(e => {
    state.inventory.search = e.target.value;
    state.inventory.page = 1;
    renderInventory();
    const next = document.getElementById('fSearch');
    if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
  }, 220));

  view.querySelector('#fCategory').addEventListener('change', e => {
    state.inventory.category = e.target.value; state.inventory.page = 1; renderInventory();
  });
  view.querySelector('#fStock').addEventListener('change', e => {
    state.inventory.stockStatus = e.target.value; state.inventory.page = 1; renderInventory();
  });
  view.querySelector('#fSupplier').addEventListener('change', e => {
    state.inventory.supplier = e.target.value; state.inventory.page = 1; renderInventory();
  });

  view.querySelector('#btnResetFilters').addEventListener('click', () => {
    Object.assign(state.inventory, {
      search:'', category:'', stockStatus:'', supplier:'',
      page:1, sortKey:'sku', sortDir:'asc'
    });
    renderInventory();
    showToast('Filters reset', 'info');
  });

  // Sorting
  view.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      const inv = state.inventory;
      if (inv.sortKey === key) inv.sortDir = inv.sortDir === 'asc' ? 'desc' : 'asc';
      else { inv.sortKey = key; inv.sortDir = 'asc'; }
      renderInventory();
    });
  });

  // Pagination
  view.querySelectorAll('.page-btn[data-page]').forEach(b => {
    b.addEventListener('click', () => {
      const p = Number(b.dataset.page);
      if (!isNaN(p) && p >= 1) { state.inventory.page = p; renderInventory(); }
    });
  });

  view.querySelector('#pageSize').addEventListener('change', e => {
    state.inventory.pageSize = Number(e.target.value);
    state.inventory.page = 1;
    renderInventory();
  });

  // Row selection
  const selAll = view.querySelector('#selectAll');
  if (selAll) {
    selAll.addEventListener('change', e => {
      const filtered = getFilteredItems();
      const start = (state.inventory.page - 1) * state.inventory.pageSize;
      filtered.slice(start, start + state.inventory.pageSize).forEach(it => {
        if (e.target.checked) state.inventory.selected.add(it.id);
        else state.inventory.selected.delete(it.id);
      });
      renderInventory();
    });
  }
  view.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = cb.dataset.id;
      if (e.target.checked) state.inventory.selected.add(id);
      else state.inventory.selected.delete(id);
      renderInventory();
    });
  });

  const bulk = view.querySelector('#btnBulkDelete');
  if (bulk) {
    bulk.addEventListener('click', () => {
      const n = state.inventory.selected.size;
      confirmDialog({
        title: 'Delete selected items',
        message: `Permanently delete <strong>${n}</strong> item${n > 1 ? 's' : ''} and all of their stock ledger history? This cannot be undone.`,
        confirmLabel: 'Delete',
        danger: true,
        onConfirm() {
          Array.from(state.inventory.selected).forEach(deleteItem);
          state.inventory.selected.clear();
          renderInventory();
          showToast(`${n} item${n > 1 ? 's' : ''} deleted successfully`);
        }
      });
    });
  }

  // Row action menus
  view.querySelectorAll('[data-rowmenu]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.rowmenu;
      openContextMenu(btn, [
        { label:'View Item',         icon:'eye',    onClick:() => openViewItem(id) },
        { label:'Edit Item',         icon:'edit',   onClick:() => openItemForm(id) },
        { label:'Adjust Stock',      icon:'adjust', onClick:() => openStockAdjustment(id) },
        { label:'View Stock Ledger', icon:'ledger', onClick:() => openItemLedger(id) },
        '---',
        { label:'Delete Item', icon:'trash', danger:true, onClick:() => confirmDeleteItem(id) }
      ]);
    });
  });

  view.querySelector('#btnAddItem').addEventListener('click', () => openItemForm(null));
  view.querySelector('#btnAdjustStock').addEventListener('click', () => openStockAdjustment(null));

  view.querySelector('#btnExportInv').addEventListener('click', () => {
    const rows = getFilteredItems().map(it => [
      it.sku, it.name, it.category, it.unit,
      it.purchasePrice, it.sellingPrice, it.currentStock,
      itemStockValue(it), calculateStockStatus(it)
    ]);
    exportCSV('hisabkit-inventory.csv',
      ['SKU','Item','Category','Unit','Purchase Price','Selling Price','Current Stock','Stock Value','Status'],
      rows);
  });

  view.querySelector('#btnPrintInv').addEventListener('click', () => window.print());
}

function confirmDeleteItem(id) {
  const item = findItem(id);
  if (!item) return;

  const guard = itemDeleteGuard(id);
  const ledgerCount = state.ledger.filter(l => l.itemId === id && !l.local).length;

  confirmDialog({
    title: 'Delete item',
    message: guard.blocked
      ? `<strong>${escapeHtml(item.name)}</strong> cannot be deleted.`
        + `<br><br>${escapeHtml(guard.message)}`
      : `Delete <strong>${escapeHtml(item.name)}</strong> (${escapeHtml(item.sku || 'no SKU')})?`
        + (ledgerCount ? `<br><br>This also removes <strong>${ledgerCount}</strong> stock ledger entr${ledgerCount > 1 ? 'ies' : 'y'} from the sheet.` : '')
        + `<br><br>This cannot be undone.`,
    confirmLabel: guard.blocked ? 'Close' : 'Delete',
    danger: !guard.blocked,
    async onConfirm() {
      if (guard.blocked) return;
      await withBusyButton(null, '', async () => {
        try {
          const done = await deleteItem(id);
          if (done) {
            renderInventory();
            showToast('Item deleted successfully');
          }
        } catch (err) {
          console.error('[HisabKit] delete item failed', err);
          showToast(describeApiError(err, 'The item could not be deleted.'), 'error');
        }
      });
    }
  });
}

function submitItemForm(form, itemId) {
  const fd = new FormData(form);
  const data = {
    name: (fd.get('name') || '').trim(),
    sku: (fd.get('sku') || '').trim(),
    category: (fd.get('category') || '').trim(),
    brand: (fd.get('brand') || '').trim(),
    unit: fd.get('unit'),
    purchasePrice: fd.get('purchasePrice'),
    sellingPrice: fd.get('sellingPrice'),
    gstRate: fd.get('gstRate'),
    openingStock: fd.get('openingStock'),
    lowStockLevel: fd.get('lowStockLevel'),
    supplierId: fd.get('supplierId'),
    description: (fd.get('description') || '').trim()
  };

  // Clear previous errors
  form.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));

  const fail = (field, msg) => {
    const wrap = form.querySelector(`[data-field="${field}"]`);
    if (wrap) {
      wrap.classList.add('invalid');
      if (msg) {
        const err = wrap.querySelector('.err');
        if (err) err.textContent = msg;
      }
      const input = wrap.querySelector('input,select,textarea');
      if (input) input.focus();
    }
    return false;
  };

  if (!data.name) { fail('name'); showToast('Please fill all required fields', 'error'); return; }
  if (!data.unit) { fail('unit'); showToast('Please fill all required fields', 'error'); return; }
  if (data.purchasePrice === '' || Number(data.purchasePrice) < 0) {
    fail('purchasePrice'); showToast('Please fill all required fields', 'error'); return;
  }
  if (data.sellingPrice === '' || Number(data.sellingPrice) < 0) {
    fail('sellingPrice'); showToast('Please fill all required fields', 'error'); return;
  }
  if (data.sku && isSkuTaken(data.sku, itemId)) {
    fail('sku', 'This SKU is already in use');
    showToast('SKU already exists', 'error');
    return;
  }
  if (Number(data.openingStock) < 0) {
    showToast('Quantity cannot be negative', 'error'); return;
  }

  const submitBtn = form.querySelector('button[type="submit"]');

  withBusyButton(submitBtn, itemId ? 'Updating…' : 'Saving…', async () => {
    try {
      if (itemId) {
        await updateItem(itemId, data);
        showToast('Item updated successfully');
      } else {
        await createItem(data);
        showToast('Item added successfully');
      }
      closeModal();
      render();
    } catch (err) {
      console.error('[HisabKit] saving item failed', err);
      if (!itemId) {
        // createItem() already kept the entry on this device and queued it.
        closeModal();
        render();
        showToast('Google Sheets unreachable — item saved on this device and will sync later.', 'error');
        return;
      }
      showToast(describeApiError(err, 'The item could not be updated.'), 'error');
    }
  });
}

      const effect = el.querySelector('#aEffect');

        const it = findItem(itemSel.value);
        const type = typeSel.value;

        hint.innerHTML = `Current stock: <strong>${formatNumber(it.currentStock)} ${escapeHtml(it.unit)}</strong>`;

        const q = Number(qtyInput.value) || 0;

          effect.innerHTML = `New stock will be <strong>${formatNumber(it.currentStock + q)} ${escapeHtml(it.unit)}</strong>.`;

          effect.innerHTML = `Stock will be set to <strong>${formatNumber(q)} ${escapeHtml(it.unit)}</strong>.`;

      itemSel.addEventListener('change', refreshHints);
      typeSel.addEventListener('change', refreshHints);
      qtyInput.addEventListener('input', refreshHints);
      refreshHints();
      qtyInput.focus();

      form.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(form);
        const spec = {
          itemId: fd.get('itemId'),

          quantity: fd.get('quantity'),
          reason: (fd.get('reason') || '').trim(),

          if (w) { w.classList.add('invalid'); const i = w.querySelector('input,select'); if (i) i.focus(); }

        withBusyButton(button, 'Updating stock…', async () => {
          const res = await adjustStock(spec);
          if (!res.ok) { showToast(res.message, 'error'); return; }

          closeModal();
          showToast('Stock updated successfully');
          render();
        });
      });

/** Resolve a range preset into { from, to } ISO dates. */
function resolveRange(filter) {
  switch (filter.range) {
    case 'thisMonth': return { from: startOfMonthISO(), to: endOfMonthISO() };
    case 'lastMonth': {
      const d = new Date();
      const first = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      const last  = new Date(d.getFullYear(), d.getMonth(), 0);
      const iso = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
      return { from: iso(first), to: iso(last) };
    }
    case 'thisYear': return { from: `${new Date().getFullYear()}-01-01`, to: `${new Date().getFullYear()}-12-31` };
    case 'custom':   return { from: filter.from || '', to: filter.to || '' };
    default:         return { from: '', to: '' };
  }
}

function dateInRange(date, range) {
  if (range.from && date < range.from) return false;
  if (range.to && date > range.to) return false;
  return true;
}

function getFilteredLedger() {
  const f = state.ledgerFilter;
  return state.ledger.filter(l => {
    if (f.itemId && l.itemId !== f.itemId) return false;
    if (f.type && l.type !== f.type) return false;
    if (f.from && l.date < f.from) return false;
    if (f.to && l.date > f.to) return false;
    return true;
  }).slice().reverse(); // newest first for display
}

  view.querySelector('#ledPrint').addEventListener('click', () => window.print());
}
